<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d232b">
<meta name="mobile-web-app-capable" content="yes">
<title>Crew Plans</title>
<style>
:root{--bg:#f1f2f4;--card:#fff;--ink:#16191d;--muted:#5d6670;--line:#dde1e6;--head:#1d232b;--accent:#f2a516;--accent-ink:#1d232b;--danger:#c62828;--ok:#2e7d32;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.noscroll{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.top .sub{font-size:13px;color:#aeb6c0;font-weight:400}
.top button{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;min-width:40px;min-height:40px;border-radius:8px}
.top button:active{background:#ffffff22}
.brand{display:inline-block;width:12px;height:12px;background:var(--accent);border-radius:3px;margin-right:8px;vertical-align:1px}
.tabs{position:sticky;top:56px;z-index:19;display:flex;background:var(--head);padding:0 8px}
.tabs button{flex:1;background:none;border:0;color:#aeb6c0;padding:11px 4px;font-weight:600;font-size:15px;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
main{padding:14px 14px calc(30px + env(safe-area-inset-bottom));max-width:860px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:active{filter:brightness(.94)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.5}
.ico{border:0;background:none;font-size:18px;padding:6px 8px;border-radius:8px;color:var(--muted);min-width:36px;min-height:36px}
.ico:active{background:#0000000f}
.job{display:flex;align-items:center;gap:12px;cursor:pointer}
.job .name{font-weight:700;font-size:17px}
.chev{color:#9aa3ad;font-size:22px}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.sheet img{display:block;width:100%;aspect-ratio:3/2;object-fit:contain;background:#fafafa;border-bottom:1px solid var(--line)}
.sheet .sname{padding:8px 34px 8px 10px;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .ico{position:absolute;right:2px;bottom:2px;font-size:15px}
.bar{height:10px;background:#e6e9ed;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px}
.prow{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:10px;margin:8px 0}
.prow label{font-size:14px;font-weight:600}
.prow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{width:100%;height:32px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logday{font-weight:700;margin:18px 2px 8px;display:flex;justify-content:space-between}
.logday .muted{font-weight:400}
.kv{font-size:14px;margin-top:4px;white-space:pre-wrap}
.kv b{color:var(--muted);font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e8ebef;color:#38414b;vertical-align:1px}
.badge.ed{background:#fff1d0;color:#7a4f00}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));z-index:300;background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;box-shadow:0 6px 20px #0004}
.mwrap{position:fixed;inset:0;z-index:150;background:#0008;display:flex;align-items:flex-end;justify-content:center}
.mcard{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.mwrap{align-items:center}.mcard{border-radius:16px}}
.mcard h2{margin:0 0 12px;font-size:19px}
.mcard h3{margin:18px 0 8px;font-size:16px}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;min-height:38px}
.chip.on{border-color:var(--head);background:var(--head);color:#fff}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.photos .ph{width:78px;height:78px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:#eee}
.addph{width:78px;height:78px;border:2px dashed #b9c0c8;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;color:var(--muted);cursor:pointer;text-align:center}
.addph b{font-size:22px;line-height:1}
.photoview{position:fixed;inset:0;z-index:400;background:#000e;display:flex;align-items:center;justify-content:center}
.photoview img{max-width:100%;max-height:100%}
.prow2{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow2:last-child{border-bottom:0}
.linkbox{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;background:#f7f8f9}
#viewer{position:fixed;inset:0;z-index:50;background:#cfd4da;display:flex;flex-direction:column}
#viewer[hidden]{display:none}
.vbar{background:var(--head);color:#fff;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;min-height:52px}
.vbar .vt{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.vbar button{background:#ffffff14;border:0;color:#fff;border-radius:8px;padding:8px 12px;font-weight:600;min-height:40px}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#board{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;background:#fff;box-shadow:0 2px 14px #0003}
#board img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
#ink{position:absolute;left:0;top:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none}
#pinLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;width:34px;height:34px;margin:-40px 0 0 -17px;border-radius:50%;border:2px solid #fff;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 2px 6px #0006;padding:0}
.pin::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top:8px solid #fff}
.pin.issue{background:#d32f2f}.pin.question{background:#f59e0b;color:#1d232b}.pin.extra{background:#0f766e}.pin.note{background:#475569}
.pin.done{background:var(--ok)!important;color:#fff!important;opacity:.85}
.vtools{background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.trow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.trow::-webkit-scrollbar{display:none}
.trow+.trow{margin-top:6px}
.tb{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-weight:600;font-size:14px;min-height:42px;white-space:nowrap}
.tb.on{background:var(--head);border-color:var(--head);color:#fff}
.pc{flex:0 0 auto;border:3px solid transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 1px #0005;min-height:40px;white-space:nowrap}
.pc.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#1d232bdd;color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow input{width:22px;height:22px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin:6px 0 2px}
.progress-note{font-size:13px;color:var(--muted);margin-top:4px}
.welcome{max-width:420px;margin:30px auto}
</style>

<script>

/* ===== constants & helpers ===== */
const SCOPE_CATALOG=[{k:'framing',n:'Framing',c:'#2563eb'},{k:'blocking',n:'Blocking',c:'#92400e'},{k:'insulation',n:'Insulation',c:'#db2777'},{k:'sheathing',n:'Sheathing',c:'#65a30d'},{k:'board',n:'Board',c:'#ea580c'},{k:'tape',n:'Tape',c:'#9333ea'},{k:'finish',n:'Finish',c:'#16a34a'},{k:'act',n:'ACT',c:'#0891b2'},{k:'frames',n:'Doors & Frames',c:'#475569'}];

function normScope(sc){if(!Array.isArray(sc)||!sc.length)return DEFAULT_SCOPE;const out=[];const seen=new Set();sc.forEach((x,i)=>{if(!x||typeof x.k!=='string'||!/^[a-z0-9_-]{1,30}$/.test(x.k)||seen.has(x.k))return;seen.add(x.k);const cat=SCOPE_CATALOG.find(c=>c.k===x.k);const col=/^#[0-9a-fA-F]{6}$/.test(x.c||'')?x.c:(cat?cat.c:CUSTOM_COLORS[i%CUSTOM_COLORS.length]);out.push({k:x.k,n:String(x.n||(cat&&cat.n)||x.k).slice(0,24),c:col})});return out.length?out:DEFAULT_SCOPE}

const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDay(s){const [y,m,d]=String(s).split('-').map(Number);if(!y)return esc(s);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function fmtWhen(v){if(!v)return '';const d=new Date(v);if(isNaN(d))return '';return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
let toastT=null;
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',4000)}
function errMsg(e){const m=String((e&&e.message)||e||'');if(/row-level security|permission denied|42501|Unauthorized|403/i.test(m+(e&&e.code||'')+(e&&e.statusCode||'')))return "You don't have permission to change that.";if(/Failed to fetch|NetworkError|network|Load failed/i.test(m))return 'No connection. Check your signal and try again.';return m||'Something went wrong.'}
async function q(p){const r=await p;if(r.error)throw r.error;return r.data}
async function run(p,okMsg){try{const d=await q(p);if(okMsg)toast(okMsg);return d==null?true:d}catch(e){toast(errMsg(e));return null}}

/* ===== state ===== */
let sb=null;
const S={me:null,isAdmin:false,jobs:[],jobsLoaded:false,job:null,role:null,tab:'plans',
  sheets:[],areas:[],logs:[],members:[],invites:[],loaded:{},people:{},urls:{},
  hidden:new Set(),pinFilter:'all',sliding:false,pendingRender:false,chan:null,jobsChan:null};
const canWrite=()=>S.role==='admin'||S.role==='editor';
const isAdminRole=()=>S.role==='admin';
function who(id){if(!id)return 'Someone';if(S.me&&id===S.me.id)return 'You';return S.people[id]||'Crew member'}

/* ===== modal helpers ===== */
function modal(inner,onClose){
  const w=document.createElement('div');w.className='mwrap';w.innerHTML='<div class="mcard">'+inner+'</div>';
  document.body.appendChild(w);let closed=false;
  w.close=()=>{if(closed)return;closed=true;w.remove();onClose&&onClose()};
  w.addEventListener('click',e=>{if(e.target===w)w.close()});return w;
}
function confirmBox(msg,okLabel='Delete',danger=true){
  return new Promise(res=>{
    const m=modal('<p style="margin:4px 0 6px;font-size:17px">'+esc(msg)+'</p><div class="mbtns"><button class="btn" data-x>Cancel</button><button class="btn '+(danger?'danger':'primary')+'" data-ok>'+esc(okLabel)+'</button></div>',()=>res(false));
    $('[data-x]',m).onclick=()=>m.close();$('[data-ok]',m).onclick=()=>{res(true);m.close()};
  });
}
function formBox(title,fields,okLabel='Save'){
  return new Promise(res=>{
    const html='<h2>'+esc(title)+'</h2><form>'+fields.map(f=>'<label class="field"><span>'+esc(f.label)+'</span>'+
      (f.type==='textarea'?'<textarea name="'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(f.value||'')+'</textarea>'
      :f.type==='select'?'<select name="'+f.k+'">'+f.options.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===f.value?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>'
      :'<input name="'+f.k+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" placeholder="'+esc(f.ph||'')+'" '+(f.req?'required':'')+'>')+'</label>').join('')+
      '<div class="mbtns"><button type="button" class="btn" data-x>Cancel</button><button class="btn primary" type="submit">'+esc(okLabel)+'</button></div></form>';
    let done=false;const m=modal(html,()=>{if(!done)res(null)});

    $('form',m).onsubmit=e=>{e.preventDefault();const o={};fields.forEach(f=>o[f.k]=String($('[name="'+f.k+'"]',m).value||'').trim());if(fields.some(f=>f.req&&!o[f.k]))return;done=true;res(o);m.close()};

  });

function progressBox(text){const m=modal('<h2>Working…</h2><p class="muted" data-t>'+esc(text)+'</p><p class="small muted">Keep this screen open until it finishes.</p>');m.set=t=>{$('[data-t]',m).textContent=t};return m}
async function showPhoto(path){const [u]=await urlsFor([path]);if(!u){toast("Couldn't load that photo.");return}const v=document.createElement('div');v.className='photoview';v.innerHTML='<img alt="">';$('img',v).src=u;v.onclick=()=>v.remove();document.body.appendChild(v)}

/* ===== files ===== */
async function urlsFor(paths){
  const need=[...new Set(paths.filter(p=>p&&!S.urls[p]))];
  if(need.length){try{const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,60*60*12);(data||[]).forEach(d=>{if(d&&d.signedUrl&&d.path)S.urls[d.path]=d.signedUrl})}catch(e){}}
  return paths.map(p=>S.urls[p]||'');

async function fillImgs(root){const imgs=$$('img[data-path]',root);if(!imgs.length)return;const us=await urlsFor(imgs.map(i=>i.dataset.path));imgs.forEach((i,k)=>{if(us[k]&&i.src!==us[k])i.src=us[k]})}
async function putFile(path,blob){const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false,cacheControl:'31536000'});if(error)throw error;return path}
const toBlob=(c,q=.82)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Could not encode image')),'image/jpeg',q));
function scaledCanvas(src,sw,sh,max){const k=Math.min(1,max/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);return c}
function loadImageFile(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res(i);i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Couldn't read that image"))};i.src=u})}
async function photoFromFile(file){const img=await loadImageFile(file);const c=scaledCanvas(img,img.naturalWidth,img.naturalHeight,1600);URL.revokeObjectURL(img.src);return toBlob(c,.8)}

/* ===== PDF ===== */
let pdfLoading=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function loadPdfJs(){if(!pdfLoading){pdfLoading=(async()=>{await loadScript(PDFJS+'pdf.min.js');await loadScript(PDFJS+'pdf.worker.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';return window.pdfjsLib})().catch(e=>{pdfLoading=null;throw e})}return pdfLoading}
const SHEET_NUM=/([A-Z]{1,3}[-.]?\d{1,3}(?:\.\d{1,3})?[A-Z]?)/;
const TITLE_KW=/\b(PLANS?|ELEVATIONS?|SECTIONS?|DETAILS?|SCHEDULES?|NOTES|SITE|ROOF|FLOOR|CEILING|FOUNDATION|FRAMING|COVER|TITLE|DEMO\w*|WALLS?|DOORS?|FINISH\w*|LAYOUT|ELECTRICAL|MECHANICAL|PLUMBING|STRUCTURAL|GENERAL|SPECIFICATIONS?|DIAGRAMS?|INDEX|ENLARGED|REFLECTED|INTERIOR|EXTERIOR|LIFE SAFETY|ACCESSIBILITY|PARTITIONS?|ASSEMBLIES|RCP)\b/;
/* make a set's sheet numbers consistent: "AD-3" -> "D-3", "D2" -> "D-2" when most sheets are "D-n" */
function harmonizeNums(items){
  const pat=n=>{const m=/^([A-Z]+)([-.]?)(\d.*)$/.exec(n||'');return m?{p:m[1],sep:m[2],rest:m[3]}:null};
  const cnt={};items.forEach(it=>{const q=pat(it.num);if(q){const k=q.p+'|'+q.sep;cnt[k]=(cnt[k]||0)+1}});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];if(!top||top[1]<3)return items;
  const [dp,ds]=top[0].split('|');
  const fits=n=>{const q=pat(n);return q&&(q.p===dp||(q.p.length>dp.length&&q.p.endsWith(dp)))};
  items.forEach(it=>{if(it.num&&!fits(it.num)&&Array.isArray(it.cands)){const alt=it.cands.find(fits);if(alt)it.num=alt}});
  items.forEach(it=>{const q=pat(it.num);if(!q)return;let p=q.p,sep=q.sep;
    if(p!==dp&&p.length>dp.length&&p.endsWith(dp))p=dp;
    if(p===dp&&sep!==ds)sep=ds;
    it.num=p+sep+q.rest});
  return items;
}
function sheetLabel(num,title){title=title?String(title).replace(/\s+/g,' ').trim():'';return num?(title?num+' – '+title:num):(title||'')}
/* fast path: PDFs that still have a text layer */
async function nameFromText(page,vp){
  try{
    const tc=await page.getTextContent();let num=null,ns=0,title=null,ts=0;
    for(const it of tc.items){
      const str=String(it.str||'').trim();if(!str)continue;const t=it.transform||[];const size=Math.hypot(t[2]||0,t[3]||0);
      const [x,y]=vp.convertToViewportPoint(t[4]||0,t[5]||0);
      const inBlock=(x>vp.width*.6&&y>vp.height*.65)||x>vp.width*.84;
      const up=str.toUpperCase();
      if(/^[A-Z]{1,3}[-.]?\d{1,3}(\.\d{1,3})?[A-Z]?$/.test(up)){const sc=size*(inBlock?3:1);if(sc>ns){ns=sc;num=up}}
      else if(inBlock&&TITLE_KW.test(up)&&str.length<=60){if(size>ts){ts=size;title=str}}
    }
    return {num,title};
  }catch(e){return {num:null,title:null}}
}

let ocrP=null,ocrBusy=Promise.resolve();
function loadOcr(){if(!ocrP){ocrP=(async()=>{await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');return await window.Tesseract.createWorker('eng')})().catch(e=>{ocrP=null;throw e})}return ocrP}
function cropFrom(src,x0,y0,x1,y1,rot,scale){
  const W=src.naturalWidth||src.width,H=src.naturalHeight||src.height;const sx=x0*W,sy=y0*H,sw=(x1-x0)*W,sh=(y1-y0)*H;
  const c=document.createElement('canvas');const rw=rot?sh:sw,rh=rot?sw:sh;c.width=Math.round(rw*scale);c.height=Math.round(rh*scale);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.scale(scale,scale);
  if(rot===90){g.translate(rw,0);g.rotate(Math.PI/2)}else if(rot===-90){g.translate(0,rh);g.rotate(-Math.PI/2)}
  g.drawImage(src,sx,sy,sw,sh,0,0,sw,sh);return c;
}
function stripLines(c,minRun){
  const g=c.getContext('2d');const w=c.width,h=c.height;const im=g.getImageData(0,0,w,h);const d=im.data;const dark=new Uint8Array(w*h),kill=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)dark[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3<140?1:0;
  for(let y=0;y<h;y++){let s=-1;for(let x=0;x<=w;x++){const on=x<w&&dark[y*w+x];if(on&&s<0)s=x;if(!on&&s>=0){if(x-s>=minRun)for(let k=s;k<x;k++)kill[y*w+k]=1;s=-1}}}
  for(let x=0;x<w;x++){let s=-1;for(let y=0;y<=h;y++){const on=y<h&&dark[y*w+x];if(on&&s<0)s=y;if(!on&&s>=0){if(y-s>=minRun)for(let k=s;k<y;k++)kill[k*w+x]=1;s=-1}}}
  for(let i=0;i<w*h;i++){const v=(dark[i]&&!kill[i])?0:255;d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255}
  g.putImageData(im,0,0);return c;
}
async function ocrNumCands(w,c,acc){
  await w.setParameters({tessedit_pageseg_mode:'11'});const r=await w.recognize(c);
  for(const x of r.data.words){const m=String(x.text).toUpperCase().match(SHEET_NUM);if(!m||!/\d/.test(m[1])||!/[A-Z]/.test(m[1]))continue;
    const k=m[1];const e=acc[k]||(acc[k]={t:k,score:0,maxConf:0});e.score+=x.confidence*(x.bbox.y1-x.bbox.y0);e.maxConf=Math.max(e.maxConf,x.confidence)}
  return acc;
}
function pickNum(acc){let best=null;for(const e of Object.values(acc))if(e.maxConf>=55&&(!best||e.score>best.score))best=e;return best}
async function ocrTitle(w,c){
  await w.setParameters({tessedit_pageseg_mode:'3'});const r=await w.recognize(c);let best=null;
  for(const ln of r.data.lines){
    const kw=ln.words.find(x=>TITLE_KW.test(String(x.text).toUpperCase()));if(!kw)continue;const h=kw.bbox.y1-kw.bbox.y0;
    const sim=ln.words.filter(x=>{const hh=x.bbox.y1-x.bbox.y0;return hh>h*.6&&hh<h*1.5&&x.confidence>40}).sort((a,b)=>a.bbox.x0-b.bbox.x0);
    const ki=sim.indexOf(kw);if(ki<0)continue;let a=ki,b=ki;
    while(a>0&&sim[a].bbox.x0-sim[a-1].bbox.x1<h*1.5)a--;while(b<sim.length-1&&sim[b+1].bbox.x0-sim[b].bbox.x1<h*1.5)b++;
    const t=sim.slice(a,b+1).map(x=>x.text).join(' ').replace(/[^A-Za-z0-9 ()&.,'\/-]/g,'').replace(/\s+/g,' ').trim();
    const sc=h*kw.confidence;const nw=t.split(' ').length;if(t.length>=4&&t.length<=48&&nw<=7&&(!best||sc>best.sc))best={t,sc};
  }
  return best;
}
async function nameFromImage(src){
  const w=await loadOcr();
  const run=async()=>{
    const acc={};
    for(const r of [[.88,.9,1,1],[.9,.93,1,1],[.84,.86,1,1],[.92,.92,.98,1]])await ocrNumCands(w,stripLines(cropFrom(src,...r,0,3),165),acc);
    let num=pickNum(acc);
    if(!num){await ocrNumCands(w,stripLines(cropFrom(src,.86,0,1,1,90,1.5),80),acc);await ocrNumCands(w,stripLines(cropFrom(src,.6,.85,1,1,0,2),110),acc);num=pickNum(acc)}
    let t=await ocrTitle(w,cropFrom(src,.86,0,1,1,90,1.5));const t2=await ocrTitle(w,cropFrom(src,.6,.8,1,1,0,1.5));if(t2&&(!t||t2.sc>t.sc))t=t2;
    const cands=Object.values(acc).filter(e=>e.maxConf>=30).sort((x,y)=>y.score-x.score).map(e=>e.t);
    return {num:num?num.t:null,title:t?t.t:null,cands};
  };
  const p=ocrBusy.then(run,run);ocrBusy=p.catch(()=>{});return p;
}

async function openJob(id){
  const j=S.jobs.find(x=>x.id===id);if(!j)return;
  S.job=j;PHASES=normScope(j.scope);S.view='job';S.tab=S.tab||'plans';S.sheets=[];S.areas=[];S.logs=[];S.members=[];S.invites=[];S.loaded={};

  else{try{const m=await q(sb.from('members').select('role').eq('job_id',id).eq('user_id',S.me.id).maybeSingle());S.role=m?m.role:null}catch(e){S.role=null}}
  if(!S.role){toast("You don't have access to that job.");S.job=null;S.view='jobs';render();return}
  lsSet('crewplans.lastJob',id);

  pins.forEach((pn,i)=>{const x=clamp(num(pn.x),0,1)*W,y=clamp(num(pn.y),0,1)*H;const col=pn.status==='done'?'#2e7d32':({issue:'#d32f2f',question:'#f59e0b',extra:'#0f766e',note:'#475569'})[pinKind(pn.kind).k];
    g.beginPath();g.arc(x,y-r*1.4,r,0,Math.PI*2);g.fillStyle=col;g.fill();g.lineWidth=r*.18;g.strokeStyle='#fff';g.stroke();
    g.fillStyle='#fff';g.font='bold '+Math.round(r*1.1)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(String(i+1),x,y-r*1.4)});
  return c;
}

        pdf.addImage(data,'JPEG',0,0,pw,ph,undefined,'FAST');pdf.setFontSize(9);pdf.setTextColor(90);pdf.text(job.name+' · '+sh.name,8,ph-6);canvas.width=canvas.height=0}

async function addPlans(files){
  const jid=S.job.id;let order=S.sheets.reduce((a,s)=>Math.max(a,num(s.sort)),0);
  const pb=progressBox('Starting…');let added=0;
  try{
    for(const file of files){
      const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);const base=file.name.replace(/\.[^.]+$/,'').slice(0,40);
      if(isPdf){
        pb.set('Loading PDF reader…');let lib;try{lib=await loadPdfJs()}catch(e){toast("Couldn't load the PDF reader. Check your signal.");break}
        pb.set('Opening '+file.name+'…');
        const made=[];
        const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
        for(let i=1;i<=pdf.numPages;i++){
          pb.set('Processing page '+i+' of '+pdf.numPages+' ('+file.name+')…');
          const page=await pdf.getPage(i);const vp1=page.getViewport({scale:1});const scale=Math.min(5,3600/Math.max(vp1.width,vp1.height));const vp=page.getViewport({scale});
          const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
          await page.render({canvasContext:cx,viewport:vp}).promise;
          let nm=await nameFromText(page,vp1);
          if(!nm.num){pb.set('Reading sheet name, page '+i+' of '+pdf.numPages+'…');try{const o=await nameFromImage(c);nm={num:o.num||nm.num,title:nm.title||o.title,cands:o.cands}}catch(e){}}
          const name=sheetLabel(nm.num,nm.title)||(pdf.numPages>1?base+' p'+i:base);
          const sid=await storeSheet(jid,c,name,++order);added++;page.cleanup();c.width=c.height=0;
          made.push({id:sid,num:nm.num,title:nm.title,cands:nm.cands,name});
        }
        const before=made.map(x=>x.num);harmonizeNums(made);
        for(let k=0;k<made.length;k++){if(made[k].num&&made[k].num!==before[k])await run(sb.from('sheets').update({name:sheetLabel(made[k].num,made[k].title)}).eq('id',made[k].id))}
        try{pdf.destroy()}catch(e){}
      }else if(/^image\//.test(file.type)){
        pb.set('Processing '+file.name+'…');const img=await loadImageFile(file);const c=scaledCanvas(img,img.naturalWidth,img.naturalHeight,4000);URL.revokeObjectURL(img.src);
        let name=base;try{pb.set('Reading sheet name ('+file.name+')…');const o=await nameFromImage(c);name=sheetLabel(o.num,o.title)||base}catch(e){}
        await storeSheet(jid,c,name,++order);added++;c.width=c.height=0;
      }else toast(file.name+' is not a PDF or image.');
    }
  }catch(e){toast(errMsg(e))}
  pb.close();if(added){toast('Added '+added+' sheet'+(added>1?'s':'')+'.');loadSheets()}

/* straight lines snap to level/plumb (and 45°) when close */
function snapLine(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(!len)return b;const ang=Math.atan2(dy,dx);const step=Math.PI/4;const near=Math.round(ang/step)*step;if(Math.abs(ang-near)<7*Math.PI/180)return {x:a.x+len*Math.cos(near),y:a.y+len*Math.sin(near)};return b}

function nearestMark(pt){
  const tol=22/V.t.s;let best=null,bd=Infinity;const M=Math.max(V.W,V.H);
  for(const m of V.marks){if(S.hidden.has(phase(m.phase).k))continue;const {kind,p}=markGeom(m);let d=Infinity;
    if(kind==='box'&&p.length>=4){const x1=p[0]*V.W,y1=p[1]*V.H,x2=p[2]*V.W,y2=p[3]*V.H;if(pt.x>=x1&&pt.x<=x2&&pt.y>=y1&&pt.y<=y2)d=0;else d=Math.min(segDist(pt.x,pt.y,x1,y1,x2,y1),segDist(pt.x,pt.y,x2,y1,x2,y2),segDist(pt.x,pt.y,x2,y2,x1,y2),segDist(pt.x,pt.y,x1,y2,x1,y1))}
    else{for(let i=0;i+3<p.length;i+=2)d=Math.min(d,segDist(pt.x,pt.y,p[i]*V.W,p[i+1]*V.H,p[i+2]*V.W,p[i+3]*V.H));d-=clamp(num(m.w,.006),.001,.03)*M/2}
    if(d<bd){bd=d;best=m}}
  return bd<=tol?best:null;
}
async function tap(cx,cy){
  const p=toImg(cx,cy);if(p.x<0||p.y<0||p.x>V.W||p.y>V.H)return;
  if(V.mode==='pin'&&canWrite())pinDialog(null,{x:r4(p.x/V.W),y:r4(p.y/V.H)});
  else if(V.mode==='erase'&&canWrite()){const m=nearestMark(p);if(!m){toast('No markup there. Zoom in and tap right on it.');return}
    if(await confirmBox('Erase this '+phase(m.phase).n+' '+(m.kind==='box'?'area':'highlight')+'?','Erase')){if(V){V.marks=V.marks.filter(x=>x.id!==m.id);drawMarks()}await run(sb.from('marks').delete().eq('id',m.id))}}
}
function visiblePins(){return V.pins.filter(p=>S.pinFilter==='all'||(S.pinFilter==='open'&&p.status!=='done'))}
function buildPins(){
  const L=$('#pinLayer');if(!L||!V||!V.W)return;
  L.innerHTML=visiblePins().map(p=>{const k=pinKind(p.kind);return '<button class="pin '+k.k+(p.status==='done'?' done':'')+'" data-id="'+esc(p.id)+'" aria-label="'+esc(k.n)+'">'+(p.status==='done'?'✓':k.i)+'</button>'}).join('');
  $$('.pin',L).forEach(b=>b.onclick=()=>{const p=V.pins.find(x=>x.id===b.dataset.id);if(p)pinDialog(p)});placePins();
}
function placePins(){if(!V||!V.W)return;$$('#pinLayer .pin').forEach(b=>{const p=V.pins.find(x=>x.id===b.dataset.id);if(!p)return;const x=clamp(num(p.x),0,1)*V.W*V.t.s+V.t.x,y=clamp(num(p.y),0,1)*V.H*V.t.s+V.t.y;b.style.transform='translate('+x+'px,'+y+'px)'})}
function layersPanel(){
  const counts={};V.marks.forEach(m=>{const k=phase(m.phase).k;counts[k]=(counts[k]||0)+1});const open=V.pins.filter(p=>p.status!=='done').length;
  const m=modal('<h2>Layers</h2>'+PHASES.map(p=>'<label class="lrow"><input type="checkbox" data-ph="'+p.k+'" '+(S.hidden.has(p.k)?'':'checked')+'><span class="dot" style="background:'+p.c+'"></span><span class="grow">'+p.n+'</span><span class="muted">'+(counts[p.k]||0)+' marks</span></label>').join('')+
    '<div style="margin-top:14px"><b>Pins</b> <span class="muted small">('+open+' open of '+V.pins.length+')</span></div><div class="chips" style="margin-top:8px">'+[['all','All'],['open','Open only'],['none','Hide']].map(([k,n])=>'<button class="chip'+(S.pinFilter===k?' on':'')+'" data-pf="'+k+'">'+n+'</button>').join('')+'</div>'+
    '<div class="legend"><span><span class="dot" style="background:#d32f2f"></span>Issue</span><span><span class="dot" style="background:#f59e0b"></span>Question</span><span><span class="dot" style="background:#0f766e"></span>Extra work</span><span><span class="dot" style="background:#475569"></span>Note</span><span><span class="dot" style="background:#2e7d32"></span>Done</span></div>'+
    '<div class="mbtns"><button class="btn primary" data-x>Done</button></div>');
  $$('[data-ph]',m).forEach(c=>c.onchange=()=>{c.checked?S.hidden.delete(c.dataset.ph):S.hidden.add(c.dataset.ph);drawMarks()});
  $$('[data-pf]',m).forEach(b=>b.onclick=()=>{S.pinFilter=b.dataset.pf;$$('[data-pf]',m).forEach(x=>x.classList.toggle('on',x===b));buildPins()});
  $('[data-x]',m).onclick=()=>m.close();
}
function pinDialog(pin,at){
  const isNew=!pin;const jid=S.job.id,sheetId=V.id;const ro=!canWrite();
  let kind=isNew?'issue':pinKind(pin.kind).k;let photos=isNew?[]:(Array.isArray(pin.photos)?pin.photos.filter(p=>typeof p==='string'):[]);
  const m=modal('<h2>'+(isNew?'New pin':esc(pinKind(pin.kind).n))+'</h2><div class="chips">'+PIN_KINDS.map(k=>'<button class="chip" data-k="'+k.k+'" '+(ro?'disabled':'')+'>'+k.n+'</button>').join('')+'</div>'+
    '<label class="field"><span>Note</span><textarea data-text '+(ro?'readonly':'')+' placeholder="What\'s going on here?">'+esc(isNew?'':pin.text||'')+'</textarea></label>'+
    '<div class="field"><span style="display:block;font-size:13px;font-weight:600;color:var(--muted)">Photos</span><div class="photos" data-ph></div></div>'+
    (isNew?'':'<div class="muted small">Added by '+esc(who(pin.created_by))+' · '+esc(fmtWhen(pin.created_at))+(pin.status==='done'?'<br>Marked done by '+esc(who(pin.done_by))+' · '+esc(fmtWhen(pin.done_at)):'')+'</div>')+
    '<div class="mbtns">'+(!isNew&&!ro&&(pin.created_by===S.me.id||isAdminRole())?'<button class="btn danger" data-del>Delete</button>':'')+(!isNew&&!ro?'<button class="btn" data-done>'+(pin.status==='done'?'Reopen':'Mark done')+'</button>':'')+
    '<button class="btn" data-x>'+(ro?'Close':'Cancel')+'</button>'+(ro?'':'<button class="btn primary" data-save>Save</button>')+'</div>');
  const syncK=()=>$$('[data-k]',m).forEach(b=>b.classList.toggle('on',b.dataset.k===kind));syncK();
  $$('[data-k]',m).forEach(b=>b.onclick=()=>{kind=b.dataset.k;syncK()});
  const drawPh=()=>{
    const box=$('[data-ph]',m);
    box.innerHTML=photos.map(p=>'<img class="ph" alt="" data-path="'+esc(p)+'">').join('')+(!ro?'<label class="addph"><b>+</b>Photo<input type="file" accept="image/*" capture="environment" hidden></label>':'')+(!photos.length&&ro?'<span class="muted small">No photos</span>':'');
    fillImgs(box);$$('.ph',box).forEach(i=>i.onclick=()=>showPhoto(i.dataset.path));
    const inp=$('input[type=file]',box);
    if(inp)inp.onchange=async()=>{const f=inp.files[0];inp.value='';if(!f)return;const lab=inp.parentElement;lab.innerHTML='<b>…</b>Uploading';
      try{const b=await photoFromFile(f);const path=await putFile(jid+'/photos/'+uuid()+'.jpg',b);photos.push(path)}catch(e){toast(errMsg(e))}drawPh()};
  };
  drawPh();
  $('[data-x]',m).onclick=()=>m.close();
  const sb2=$('[data-save]',m);
  if(sb2)sb2.onclick=async()=>{const text=$('[data-text]',m).value.trim().slice(0,2000);sb2.disabled=true;
    const ok=isNew?await run(sb.from('pins').insert({job_id:jid,sheet_id:sheetId,x:at.x,y:at.y,kind,text,photos,status:'open'}))
      :await run(sb.from('pins').update({kind,text,photos}).eq('id',pin.id));
    if(ok){m.close();if(isNew&&V)setMode('pan');loadSheetData()}else sb2.disabled=false};
  const db=$('[data-done]',m);
  if(db)db.onclick=async()=>{const reopen=pin.status==='done';if(await run(sb.from('pins').update(reopen?{status:'open',done_by:null,done_at:null}:{status:'done',done_by:S.me.id,done_at:new Date().toISOString()}).eq('id',pin.id))){m.close();loadSheetData()}};
  const dl=$('[data-del]',m);
  if(dl)dl.onclick=async()=>{m.close();if(await confirmBox('Delete this pin for everyone?')&&await run(sb.from('pins').delete().eq('id',pin.id)))loadSheetData()};
}
</script>
