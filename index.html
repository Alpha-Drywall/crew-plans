<style>
:root{--bg:#f1f2f4;--card:#fff;--ink:#16191d;--muted:#5d6670;--line:#dde1e6;--head:#1d232b;--accent:#f2a516;--accent-ink:#1d232b;--danger:#c62828;--ok:#2e7d32;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.noscroll{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:4px;min-height:56px}
.top h1{grid-column:2;font-size:19px;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;text-align:center}
.top h1 .ttl{display:flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;letter-spacing:.6px}
.top h1 .brand{width:26px;height:26px;flex:none}
.top .jn{font-size:15px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.top .jn .sub{font-size:12px}
.top>button:last-child:not(:first-child){grid-column:3}
.jhead{position:sticky;top:0;z-index:20}
.jhead .top,.jhead .tabs{position:static}
.pbar{display:flex;gap:8px;align-items:center;margin:0 0 8px}
.pbar .btn{flex:none;white-space:nowrap}
.pbar select{flex:1;min-width:0;min-height:36px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;background:#fff;font-size:14px}
.pbar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-size:13px}
.pbar2 label{display:flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap}
.pbar2 input{width:18px;height:18px}
.pbar2 .grow{flex:1}
.olist{max-height:62vh;overflow:auto;margin:8px 0}
.osec{font-size:15px;margin:14px 0 6px}
.orow{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.orow>input{width:22px;height:22px;flex:none;margin-top:2px}
.orow .grow{flex:1;min-width:0}
.orow input:not([type]){width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-top:4px;font-size:14px}
.top .jl{display:none}
.dsk{display:none}
.tcper{display:flex;align-items:center;gap:10px;margin:0 0 12px;text-align:center}
.tcper .btn{min-width:44px}
.tchead{display:flex;gap:10px;flex-wrap:wrap}.tchead .field{flex:1;min-width:150px}
.tcsum{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin:4px 0 2px}
.tcw{padding:0;margin-bottom:10px}.tcwh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.tcwb{padding:0 12px 12px;border-top:1px solid var(--line)}
.tcwf{display:flex;gap:10px}.tcwf .field{flex:1}
.a2hs{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.25)}.a2card{background:#fff;color:#1f2328;border-radius:14px;padding:14px;max-width:520px;margin:0 auto;box-shadow:0 -4px 24px rgba(0,0,0,.25)}.a2ico{width:34px;height:34px;flex:none}.a2steps{margin:0 0 10px;padding-left:22px;line-height:1.45}.a2steps li{margin:4px 0}.a2k{display:inline-block;border:1px solid #bbb;border-radius:5px;padding:0 5px}
.tcbank{border:1px solid var(--line,#ddd);border-radius:10px;padding:10px;margin:0 0 12px;background:rgba(0,0,0,.02)}.tcbank .tcwf{margin-top:8px}
.tcday{border-top:1px solid var(--line);padding:8px 8px;margin:0 -8px}
.tcday.alt{background:#eef0f3}.tcday.alt .tcl{background:#fff}
.tcdh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tcl{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap;padding:6px;background:#f6f7f9;border-radius:10px}
.tcl select[data-job]{flex:1 1 100%}
.tcl select{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;font-size:14px}
.tcl select[data-code]{flex:1 1 auto}
@media (min-width:700px){.tcl{flex-wrap:nowrap}.tcl select[data-job]{flex:1 1 auto}.tcl select[data-code]{flex:0 0 190px}}
.tcl input{width:62px;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:15px;text-align:right}

.hbar .chips{margin:0;flex:1;min-width:0}
.hbar .btn.sm{flex:none}
.hseg{display:inline-flex;background:#e3e6ea;border-radius:11px;padding:3px;gap:2px;flex:none}

.hseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0000002e}
.hseg.sm button{padding:5px 11px;font-size:13px;min-height:32px}
.hbar>.hseg{margin-right:auto}
.bfil{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.bfil input{flex:1;min-width:170px;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:#fff;font-size:15px}
.bsum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bsum{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 0}
.blink{border:0;background:none;color:#1f4e8c;font-weight:700;font-size:13px;padding:6px 2px;min-height:32px;cursor:pointer}
.blink:hover{text-decoration:underline}
.bsh{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:6px 4px;border-radius:8px;min-height:40px}
.bsh:hover{background:#0000000a}.bsh:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bsh .bshn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsh .muted{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bchv{flex:none;width:16px;text-align:center;font-size:20px;line-height:1;color:#7b8591;transition:transform .15s;transform:rotate(90deg)}
.bsh[aria-expanded=false] .bchv{transform:none}
.bsh.l1{font-weight:800;font-size:17px;margin:16px 0 4px;border-bottom:2px solid var(--line);border-radius:8px 8px 0 0}
.bsh.l1.solo{cursor:default;padding-left:4px}.bsh.l1.solo:hover{background:none}
.bsh.l2{font-weight:700;font-size:14px;margin:6px 0 4px;padding-left:10px;min-height:36px}
.bsh.l2 .bshn{text-transform:uppercase;letter-spacing:.04em;font-size:12.5px;color:#38414b}
.bsh.l2.tdy .bshn{color:#b42318}
.bsh .edot,.bests .edot{flex:none;width:10px;height:10px;border-radius:50%;display:inline-block}
.bsh.l2 .edot+.bshn{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)}
.bests{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 0 6px;padding:2px 1px}.bests::-webkit-scrollbar{display:none}
.bests .chip{flex:none;display:inline-flex;align-items:center;gap:6px}
.best{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--ec) 15%,#fff);border:1px solid color-mix(in srgb,var(--ec) 50%,#fff);border-radius:999px;padding:0 7px 0 5px;line-height:18px;margin-right:6px;vertical-align:1px;white-space:nowrap}
.best i{width:8px;height:8px;border-radius:50%;background:var(--ec);flex:none}
/* This week: Mon-Sun strip on wide screens, one tappable line on phones (both rendered, CSS picks one) */
.bwk{margin:0 0 12px}
.bwk-s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px}
.bwk-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px;flex-wrap:wrap}
.bwk-k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7a4b00}
.bwk-t{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bwk-r{margin-left:auto;font-size:12px;color:var(--muted)}
.bwk-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.bwk-c{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;border:1px solid var(--line);background:#fafbfc;border-radius:9px;padding:6px 8px 7px;font:inherit;color:inherit;text-align:left;min-height:74px}
button.bwk-c{cursor:pointer;background:#fff}button.bwk-c:hover{border-color:#b9c0c8;background:#fffdf7}
.bwk-c:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bwk-c .bwd{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#5d6670}
.bwk-c .bwn{font-size:12px;color:var(--muted);white-space:nowrap}
.bwk-c .bwc{font-size:20px;font-weight:800;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.bwk-c .bwc small{font-size:11px;font-weight:700;color:var(--muted);margin-left:3px;letter-spacing:.02em}
.bwk-c .bwz{font-size:16px;color:#b9c0c8;margin-top:4px}
.bwk-c .bwdots{display:flex;align-items:center;gap:3px;flex-wrap:wrap;min-height:9px}
.bwk-c .bwdots i{width:8px;height:8px;border-radius:50%;flex:none}
.bwk-c .bwdots em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.bwk-c.tdy{border:2px solid var(--accent);padding:5px 7px 6px;background:#fffbf0}
.bwk-c.tdy .bwd{color:#7a4b00}
.bwk-c.due .bwc{color:#b42318}
.bwk-c.past{opacity:.5}
.bwk-l{display:none;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--accent);background:#fff;border-radius:10px;padding:8px 10px 8px 12px;font:inherit;color:inherit;cursor:pointer;min-height:44px;white-space:nowrap;overflow:hidden}
.bwk-l:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bwk-l .bwk-k{flex:none}.bwk-l .bwk-t{flex:none;font-size:13px}
.bwk-l .bwsep{flex:none;color:#9aa3ad}
.bwk-l .bwnx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.bwk-l .bwnx b{font-weight:800}
.bwk-l .bwnx .edot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}
.bwk-l .bwm{flex:none;font-size:12px;color:var(--muted)}
.bwk-l .bwgo{flex:none;font-size:20px;line-height:1;color:#7b8591;margin-left:2px}
.bwk-l.tdy{border-left-color:#d92d20;background:#fff8f7}.bwk-l.tdy .bwk-k{color:#b42318}
@media(max-width:699px){.bwk-s{display:none}.bwk-l{display:flex}}
.bwk-one .bwk-s{display:none}.bwk-one .bwk-l{display:flex}
.bwsh h2{margin:0 0 2px}.bwsh .bwsub{font-size:13px;color:var(--muted);margin:0 0 10px}
.bwsh .bwdh{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#38414b;margin:12px 2px 4px;display:flex;gap:8px}
.bwsh .bwdh.tdy{color:#b42318}.bwsh .bwdh span{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.bwsh .bwrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;margin:0 0 6px;font:inherit;color:inherit;cursor:pointer;min-height:48px}
.bwsh .bwrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bwsh .bwrow .bwrn{flex:1;min-width:0}.bwsh .bwrow .bwrn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.bwsh .bwrow .bwrn .best{margin-top:3px}
.bwsh .bwrow .bwra{flex:none;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bwsh .bwrow .bwra .muted{font-weight:400;font-size:13px}
.bidc.bflash{animation:bflash 1.8s ease-out}
@keyframes bflash{0%,35%{box-shadow:0 0 0 3px var(--accent);background:#fff6dd}100%{box-shadow:0 0 0 3px transparent;background:#fff}}
main.dense .bsh.l1{margin:10px 0 2px;min-height:34px;padding:3px 4px}main.dense .bsh.l2{min-height:30px;margin:2px 0}
main.dense .bwk{margin-bottom:8px}main.dense .bwk-s{padding:6px 8px 8px}main.dense .bwk-h{margin-bottom:5px}main.dense .bwk-c{min-height:58px;padding:4px 7px 5px}main.dense .bwk-c.tdy{padding:3px 6px 4px}main.dense .bwk-c .bwc{font-size:17px;margin-top:0}main.dense .bwk-l{padding:5px 10px;min-height:38px}
html.hc .best,html.hc .bwk-s,html.hc .bwk-l,html.hc .bwk-c,html.hc .bwsh .bwrow{border-width:2px}html.hc .bwk-c.tdy{border-width:3px;padding:4px 6px 5px}html.hc .bwk-c.past{opacity:.7}html.hc .bwk-c .bwz{color:#7b8591}html.hc .bsh.l1{border-bottom-color:#59626d}html.hc .bchv{color:#262c33}html.hc .blink{color:#0b3a75}

async function flushOutbox(){

  try{
    let tok=null;try{tok=(await sb.auth.getSession()).data.session?.access_token}catch(e){}
    while(true){
      const op=myOps()[0];if(!op)break;
      const h=new Headers(op.headers);if(tok)h.set('authorization','Bearer '+tok);
      let body=op.body;if(body&&body.form){const fd=new FormData();body.form.forEach(([k,v])=>fd.append(k,v));body=fd;h.delete('content-type')}

      noteOnline(true);
      if(res.status>=500||res.status===401||res.status===408||res.status===429){
        op.tries=(op.tries||0)+1;
        if(op.tries<8){await idbPut('outbox',op);if(res.status===401){try{await sb.auth.refreshSession()}catch(e){}}break}
        gaveUp++;
      }else if(!res.ok&&res.status!==409){let t='';try{t=await res.text()}catch(e){}if(!/Duplicate|already exists|23505/i.test(t))dropped++}

    }
  }finally{OFF.flushing=false;netPill()}
  if(dropped||gaveUp)toast((dropped+gaveUp)+' change'+(dropped+gaveUp>1?'s':'')+" couldn't be saved"+(gaveUp?' after several tries':'. You may not have permission anymore')+'.');

function tcBankBox(c,w){

    '<div class="tcwf"><label class="field" style="max-width:150px"><span>Bank at start (hrs)</span><input id="tcBankStart" inputmode="decimal" value="'+esc(b.start==null?'':String(b.start))+'"></label>'+

function openTimecards(){S.view='tc';TC.start=TC.start||tcPeriodOf(tcToday());TC.open=-1;window.scrollTo(0,0);if(!tcAllowed()){TC.force=true;render();return}loadTc()}

async function loadTc(){
  TC.loading=true;TC.card=null;TC.loadedFor=TC.start;TC.force=true;render();
  try{
    const me=S.me.id;
    let mine=await q(sb.from('timecards').select('*').eq('owner',me).eq('period_start',TC.start).maybeSingle());
    if(!mine){
      const prev=await q(sb.from('timecards').select('*').eq('owner',me).lt('period_start',TC.start).order('period_start',{ascending:false}).limit(1));
      const p=(prev&&prev[0])||{};let fm=p.foreman||(S.me.user_metadata||{}).full_name||myName()||'';
      if(!fm){try{fm=(((await q(sb.from('members').select('name').eq('user_id',me).order('joined_at',{ascending:false}).limit(1)))||[])[0]||{}).name||''}catch(e){}}
      mine={id:null,owner:me,period_start:TC.start,foreman:fm,folder:p.folder||tcFirst(fm),status:'draft',teams_to:p.teams_to||null,workers:(p.workers||[]).map(w=>{const o={name:w.name||'',rate:w.rate||'',days:{}};if(w.bank)o.bank={on:!!w.bank.on,start:w.bankRes&&w.bankRes.end!=null&&p.status==='submitted'?w.bankRes.end:tcBankCalc(w).end};return o})};
      if(isPractice()&&!mine.workers.length)mine.workers=['Sample Framer','Sample Hanger','Sample Taper'].map(n=>({name:n,rate:'',days:{}}));
      if(fm){const k=tcKey(fm),i=mine.workers.findIndex(w=>tcKey(w.name)===k);if(i>0)mine.workers.unshift(mine.workers.splice(i,1)[0]);else if(i<0)mine.workers.unshift({name:fm,rate:'',days:{}})}
    }
    TC.card=mine;if(TC.openFirst){TC.openFirst=false;if(mine.workers.length)TC.open=0}
    try{TC.roster=crewOnly(await q(sb.from('crew_roster').select('*').eq('active',true).order('name')))}catch(e){TC.roster=TC.roster||[]}
    tcRefreshRates();
    if(S.isAdmin&&!TC.fms){try{TC.fms=(await q(sb.rpc('foreman_accounts')))||[]}catch(e){TC.fms=[]}}
    TC.list=S.isAdmin?(await q(sb.from('timecards').select('id,owner,foreman,folder,workers,status,submitted_at,filed_at,file_name,file_error,updated_at').eq('period_start',TC.start).order('foreman')))||[]:[];
  }catch(e){toast(errMsg(e))}

}
function tcRefreshRates(force){const c=TC.card;if(!c||!force&&c.status==='submitted'&&!S.isAdmin)return;let ch=false;

async function tcRosterSave(name,rate,w){
  name=String(name||'').trim().slice(0,60);if(!name||isOfficeName(name))return;const r=tcRoster(name);
  const rv=rate!==undefined&&String(rate).trim()!==''&&isFinite(+rate)?+rate:null;
  if(r){if(rate!==undefined&&String(r.rate)!==String(rv)){r.rate=rv;await run(sb.from('crew_roster').update({rate:rv}).eq('id',r.id))}return}

  let old=null;try{old=((await q(sb.from('crew_roster').select('*').ilike('name',name.replace(/[%_]/g,'')).limit(1)))||[])[0]}catch(e){}
  if(old){const up={active:true};if(rv!=null)up.rate=rv;await run(sb.from('crew_roster').update(up).eq('id',old.id));TC.roster.push(Object.assign(old,up));TC.roster.sort((a,b)=>a.name.localeCompare(b.name));return}

  if(d&&d.id)TC.roster.push(d);else TC.roster.push(Object.assign({id:null,active:true},row));

async function tcFlush(){

  if(changed)return 'Changed since you submitted. Submit again to update the Excel file.';
  const tm=c.teams_to&&c.pdf_path?(c.teams_sent_at&&c.teams_sent_at>=c.submitted_at?' · ✓ PDF sent to '+c.teams_to+' in Teams':c.teams_error?' · Teams: '+c.teams_error:' · PDF going to '+c.teams_to+' in Teams…'):'';

  if(c.file_error)return 'Submitted. Not saved to Excel yet: '+c.file_error;
  return 'Submitted. It will be saved to Timecards/'+(c.folder||'?')+' in Excel.';
}

function tcCardStatus(x){if(!x)return ['Not started',''];if(x.status!=='submitted')return ['Draft',''];if(x.filed_at&&x.filed_at>=x.submitted_at)return ['Saved to Excel',' ok'];return [x.file_error?'Not saved yet':'Submitted',' wait']}
function tcCrewList(c){

function tipsFor(key){
  try{if(navigator.webdriver)return}catch(e){}
  if(!tipsOn()||tipBusy||lsGet('acv.tipSeen.'+key)||document.querySelector('.mwrap'))return;
  const vis=el=>{if(!el)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0};
  const pick=q=>[...document.querySelectorAll(q)].find(vis);
  const steps=(TIPS[key]||[]).map(s=>({q:s[0],el:pick(s[0]),t:tipLang()==='es'?s[2]:s[1]})).filter(s=>s.el);
  if(!steps.length)return false;
  lsSet('acv.tipSeen.'+key,'1');tipBusy=true;
  const es=tipLang()==='es';let i=0;
  const ov=document.createElement('div');ov.className='tipov';document.body.appendChild(ov);
  const hole=document.createElement('div');hole.className='tiphole';ov.appendChild(hole);
  const bub=document.createElement('div');bub.className='tipbub';ov.appendChild(bub);
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done()}};
  const done=()=>{ov.remove();tipBusy=false;window.removeEventListener('keydown',onKey,true)};
  window.addEventListener('keydown',onKey,true);
  if(TIP_LOOSE.has(key))ov.addEventListener('pointerdown',e=>{if(!bub.contains(e.target)){e.preventDefault();e.stopPropagation();done()}});
  const show=()=>{
    const s=steps[i];if(!s.el.isConnected||!vis(s.el))s.el=pick(s.q);/* the list may have been redrawn since */
    if(!s.el){steps.splice(i,1);if(i>=steps.length)done();else show();return}
    try{s.el.scrollIntoView({block:'center',behavior:'instant'})}catch(e){s.el.scrollIntoView()}
    setTimeout(()=>{
      if(!s.el.isConnected)s.el=pick(s.q)||s.el;
      const r=s.el.getBoundingClientRect();const p=6;
      Object.assign(hole.style,{left:(r.left-p)+'px',top:(r.top-p)+'px',width:(r.width+2*p)+'px',height:(r.height+2*p)+'px'});
      bub.innerHTML='<div>'+esc(s.t)+'</div><div class="tipbtns"><span class="muted small">'+(i+1)+' / '+steps.length+'</span><button class="btn sm" data-skip>'+(es?'Saltar':'Skip')+'</button><button class="btn sm primary" data-next>'+(i<steps.length-1?(es?'Siguiente':'Next'):(es?'Listo':'Got it'))+'</button></div>';
      const bw=Math.min(320,innerWidth-24);bub.style.width=bw+'px';
      bub.style.left=Math.max(12,Math.min(innerWidth-bw-12,r.left+r.width/2-bw/2))+'px';
      const below=r.bottom+p+12,bh=bub.offsetHeight||110;
      bub.style.top=(below+bh<innerHeight-8?below:Math.max(8,r.top-p-12-bh))+'px';
      $('[data-next]',bub).onclick=()=>{i++;if(i>=steps.length)done();else show()};
      $('[data-skip]',bub).onclick=done;
    },120);
  };
  show();return true;
}

const LK={start:'',mode:'people',plans:{},loaded:false,loading:false,roster:[],cards:[],fms:[],sel:[],multi:false,sat:false,sx:0,q:null,M:null,addJobs:[]};

const lookDow=iso=>new Date(iso+'T12:00:00Z').getUTCDay();
/** Monday that starts the board: this week’s Monday; on Saturday or Sunday the coming Monday. */
function lookMonday(iso){const d=lookDow(iso);return isoAddD(iso,d===0?1:d===6?2:1-d)}

function lookDays(mon,sat){const out=[];for(let w=0;w<2;w++)for(let d=0;d<6;d++){const iso=isoAddD(mon,w*7+d);if(d<5||(sat&&sat(iso)))out.push(iso)}return out}

/** Plan a job (or null = nothing) for these names on these dates. keep=true keeps their other jobs that day (split day); otherwise they come off other jobs that day. Returns new plans. */
function lookSet(plans,job,names,dates,keep){const P=JSON.parse(JSON.stringify(plans||{}));const ks=names.map(tcKey);
  dates.forEach(d=>{Object.keys(P).forEach(j=>{if(j===job||(keep&&job))return;const a=P[j][d];if(a){P[j][d]=a.filter(n=>!ks.includes(tcKey(n)));if(!P[j][d].length)delete P[j][d]}});

function lookDrop(plans,job,names,dates){const P=JSON.parse(JSON.stringify(plans||{}));const ks=names.map(tcKey);const p=P[job];if(!p)return P;
  dates.forEach(d=>{if(!p[d])return;p[d]=p[d].filter(n=>!ks.includes(tcKey(n)));if(!p[d].length)delete p[d]});return P}

function lookClearJob(plans,job,from){const P=JSON.parse(JSON.stringify(plans||{})),gone={},p=P[job];if(!p)return {plans:P,gone};

function lookShownIds(jobs,plans,days,td,active,added,hidden){return (jobs||[]).filter(j=>{const p=(plans||{})[j.id]||{},on=d=>((p[d]||[]).length>0),hid=(hidden||[]).includes(j.id);

/** What each worker worked most recently on the time cards: {nameKey:{job,date,name}} = the app job with the most hours that day. Lines that match no job (office, vacation) are skipped. Only days before `before`. */
function lookLastWorked(cards,jobs,before){const keys=(jobs||[]).map(j=>[j.id,tcJobKey(j)]);const o={};

    (c.workers||[]).forEach(w=>{const k=tcKey(w.name);((w.days&&w.days[d])||[]).forEach(l=>{if(!tcHrs(l))return;const m=keys.find(J=>tcIsJob(l,J[1][0],J[1][1]));const id=m?m[0]:'other';const a=o[k]=o[k]||[];if(!a.includes(id))a.push(id)})})});

/** Board rows: [{fm, names}] grouped by foreman. A worker goes under the foreman whose time card had him most recently; a foreman heads his own group.

function lookGroups(cards,roster,fms,skip,extra){const fmOf={},nm={},isFm=new Set();const add=n=>{const k=tcKey(n);if(k&&!nm[k])nm[k]=String(n).trim();return k};

/** Short job name for the board cells, made from the job name: first real word (skips U, of, the…), a 3-letter word gets the next word if it fits (IFA Elko), max 8 letters.

  const tc=x=>/\d/.test(x)||x.length<=3?x.toUpperCase():x.charAt(0).toUpperCase()+x.slice(1).toLowerCase();let t=tc(ws[0]);

function lookNames(jobs){const o={},c={};(jobs||[]).forEach(j=>{const t=lookAuto(j.name);o[j.id]=t;c[t]=(c[t]||0)+1});

/** Number + full name for pickers and row labels: 330 U OF U OR5 HYBRID ROOM UPGRADE */

const lkJob=id=>(S.jobs||[]).find(j=>j.id===id);

  for(let i=0;i<n;i++){let v;if(i===0)v=nr(P[0],P[1]);else if(i===n-1)v=nr(P[n-2],P[n-1]);else{const a=nr(P[i-1],P[i]),b=nr(P[i],P[i+1]),mx=a[0]+b[0],my=a[1]+b[1],ml=Math.hypot(mx,my);if(ml<1e-6)v=a;else{const k=Math.min(4,1/Math.max(.25,(mx*a[0]+my*a[1])/ml));v=[mx/ml*k,my/ml*k]}}out.push((P[i][0]+v[0]*d)/W,(P[i][1]+v[1]*d)/H)}return out}

/* Job screen tabs. Phones (<700px): two labeled rows, Field (what crews use) and Office (office-only tabs), when there are 4+ tabs and an office-only one;
   a foreman's 5 tabs split Field (Plans, Progress, Daily Report) / More (Labor, Materials).
   Desktop: one row (the labels hide). Which tabs a person gets is decided by the caller (tkOk / canLog / billTabOk), not here. */
const JT_LAB={plans:'Plans',progress:'Progress',takeoff:'Takeoff',log:'Daily Report',labor:'Labor',mat:'Materials',money:'Money'};
const JT_OFFICE=['takeoff','mat','money'];
function jobTabRows(ids){ids=(ids||[]).filter(t=>JT_LAB[t]);const off=ids.filter(t=>JT_OFFICE.includes(t));
  if(ids.length>=5&&!off.some(t=>t!=='mat')){const f=ids.filter(t=>t==='plans'||t==='progress'||t==='log');return [{l:'Field',ids:f},{l:'More',ids:ids.filter(t=>!f.includes(t))}]}
  if(ids.length<4||!off.some(t=>t!=='mat'))return [{l:'',ids}];
  return [{l:'Field',ids:ids.filter(t=>!off.includes(t))},{l:'Office',ids:off}]}
function jobTabsHtml(ids){const rows=jobTabRows(ids),two=rows.length>1;
  return '<div class="tabs'+(two?' tabs2':'')+'" role="tablist">'+rows.map(r=>'<div class="tg"'+(r.l?' role="group" aria-label="'+r.l+'"':'')+'>'+(r.l?'<span class="tgl" aria-hidden="true">'+r.l+'</span>':'')+r.ids.map(t=>'<button role="tab" data-tab="'+t+'">'+JT_LAB[t]+'</button>').join('')+'</div>').join('')+'</div>'}

   Foremen and view-only crew keep the simple home (their jobs + their time cards). ===== */

/* ===== Bids: tracker fields on each bid (amount, status, result, GCs invited, follow-up log) and the Pipeline page. Office only. ===== */
const BID_ST=[['open','Open'],['submitted','Submitted'],['won','Won'],['lost','Lost'],['nobid','No bid'],['rebid','Re-bid']];
const bidStLabel=s=>s==='noword'?'Lost (no word)':(BID_ST.find(x=>x[0]===s)||['',''])[1];
const isoD=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const dayDiff=(a,b)=>{const p=s=>{const [y,m,d]=String(s).split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* a bid with no answer (Open / Submitted / not set) this many days after its bid date counts as lost */
const BID_NOWORD_DAYS=90;
/* derived status, never saved: s = the saved or date-based status; Open / Submitted with a bid date more than `days` days before td -> 'noword' (Lost, no word). Won / Lost / No bid / Re-bid stay. */
function bidNoWord(s,bd,td,days){
  if(s!=='open'&&s!=='submitted')return s;
  if(!bd||!/^\d{4}-\d\d-\d\d/.test(String(bd))||!td)return s;
  return dayDiff(String(bd).slice(0,10),td)>days?'noword':s;
}
/* lost for counting: a real Lost, or no word 90+ days after the bid date */
const bidLost=s=>s==='lost'||s==='noword';
/* has a result (Results filter): won, lost, lost (no word), no bid */
const bidRes=s=>s==='won'||s==='lost'||s==='noword'||s==='nobid';
/* status shown for a bid: the saved status, or Open / Submitted from the bid date (an awarded job counts as Won); no answer 90+ days after the bid date shows as Lost (no word) */
const bidStat=(j,td)=>bidNoWord(j.bid_status&&BID_ST.some(s=>s[0]===j.bid_status)?j.bid_status:j.stage==='job'?'won':(j.bid_date&&j.bid_date<td?'submitted':'open'),j.bid_date,td,BID_NOWORD_DAYS);
/* Open = due today or later, or still waiting (open / submitted / re-bid). Results = won, lost, lost (no word), no bid. */
/* In for review: an estimator asks the office to look over a bid before it goes out. Kept in jobs.bid_notes as entries {kind:'review',state:'in'|'done'|'cancel',by,at,ts,text}
   (no new column); the newest review entry decides. bidReview → null (never asked) or {on,state,by,at,ts}. Office only; in-app badge, no email/Teams. */
function bidReview(notes){let r=null;(Array.isArray(notes)?notes:[]).forEach(n=>{if(n&&n.kind==='review'&&(n.state==='in'||n.state==='done'||n.state==='cancel'))r=n});
  return r?{on:r.state==='in',state:r.state,by:r.by||'',at:r.at||'',ts:r.ts||''}:null}
const BID_REV_TXT={in:'In for review',done:'Reviewed',cancel:'Review canceled'};
const bidReviewNote=(state,by,at,ts)=>({kind:'review',state,by:String(by||'Office'),at,ts,text:BID_REV_TXT[state]});
const bidInRev=j=>!!(bidReview(j&&j.bid_notes)||{}).on;

const bidGcs=j=>Array.isArray(j.bid_gcs)&&j.bid_gcs.length?j.bid_gcs:String(j.gc_name||'').split(/\s*[,;]\s*/).filter(Boolean).map((n,i,a)=>({name:n,email:a.length===1?String(j.gc_email||''):''}));

function estColor(name){const ns=[...new Set((S.office||[]).map(o=>o.name))].sort((a,b)=>a.localeCompare(b));const i=ns.indexOf(name);return i>=0&&i<EST_COL.length?EST_COL[i]:'#9aa3ad'}
/* list phase of a bid: 0 coming up (bid date today or later, no result), 1 waiting on results, 2 no bid date, 3 results */
const bidPh=(j,td)=>bidRes(bidStat(j,td))?3:!j.bid_date?2:String(j.bid_date).slice(0,10)>=td?0:1;
/* Coming up split by calendar work week (Mon-Sun, not the pay period): Due today, This week (rest of this week), Next week, Later. Each sorted by bid date, then name. Empty groups dropped. */
function bidComingGroups(list,td){
  const g=[['today','Due today',[]],['week','This week',[]],['next','Next week',[]],['later','Later',[]]];
  const [y,m,d]=String(td).split('-').map(Number),eow=6-(new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7;
  (list||[]).filter(j=>bidPh(j,td)===0).sort((a,b)=>String(a.bid_date).localeCompare(String(b.bid_date))||String(a.name||'').localeCompare(String(b.name||''))).forEach(j=>{const n=dayDiff(td,String(j.bid_date).slice(0,10));g[n<=0?0:n<=eow?1:n<=eow+7?2:3][2].push(j)});
  return g.filter(x=>x[2].length)}
/* estimator groups A-Z, No estimator last */
const bidEstSort=(a,b)=>a==='No estimator'?1:b==='No estimator'?-1:a.localeCompare(b);

/* bid list sections: Coming up (split Due today / This week / Next week / Later), Waiting on results, No bid date, Results (newest first).
   byEst (All bids): Waiting on results and Results are grouped by estimator. nm(j) -> estimator name. */
function bidSecs(list,td,nm,byEst){
  const L=[['up','Coming up'],['wait','Waiting on results'],['nodate','No bid date'],['res','Results']],b=[[],[],[],[]];
  const rec=(x,y)=>String(y.result_date||y.bid_date||y.created_at||'').localeCompare(String(x.result_date||x.bid_date||x.created_at||''));
  (list||[]).forEach(j=>b[bidPh(j,td)].push(j));
  return L.map((x,i)=>{const s={k:x[0],label:x[1]};
    if(i===0){s.subs=bidComingGroups(b[0],td);s.items=[].concat(...s.subs.map(g=>g[2]))}else s.items=b[i].slice().sort(rec);
    if(byEst&&(i===1||i===3)){const g={};s.items.forEach(j=>{const k=nm(j)||'No estimator';(g[k]=g[k]||[]).push(j)});s.groups=Object.keys(g).sort(bidEstSort).map(k=>[k,g[k]])}

/* This week at the top of Bids: the bids due in this calendar week (Mon-Sun, same weeks as Coming up), bucketed by day.

   pm: only that estimator's bids (My bids). null when neither week has a bid still coming up. */
function bidWeekDays(list,td,pm){
  const [y,m,d]=String(td).split('-').map(Number),t0=Date.UTC(y,m-1,d),dow=(new Date(t0).getUTCDay()+6)%7,L=(list||[]).filter(j=>j.bid_date&&(!pm||j.pm===pm));

    for(let i=0;i<7;i++){const s=iso(w*7+i);days.push({d:DOW3[(i+1)%7],iso:s,items:L.filter(j=>String(j.bid_date).slice(0,10)===s&&(s>=td?bidPh(j,td)===0:bidStat(j,td)!=='nobid')).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')))})}
    const up=[].concat(...days.filter(x=>x.iso>=td).map(x=>x.items));
    return {label:w?'Next week':'This week',days,total:up.length,amt:up.reduce((a,j)=>a+(Number(j.bid_amount)||0),0)}};
  const a=mk(0);if(a.total)return a;const b=mk(1);return b.total?b:null}

    try{await loadExcel();const wb=new window.ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());const yr=+((f.name.match(/20\d\d/)||[])[0])||new Date().getFullYear();const recs=trkParseBook(trkSheets(wb),yr,today());P={yr,file:f.name,items:trkPlan(recs,pipeAll(),S.office||[],yr)}}

function trkPreview(P){const it=P.items;it.forEach(x=>x.on=x.action!=='skip');let filt='all';const m=modal('<div class="tp"></div>');$('.mcard',m).classList.add('xwide');
  const est=x=>x.pm?pmName(x.pm):(x.r.est||'?');
  const paint=()=>{const c=a=>it.filter(x=>x.action===a).length,fl=it.filter(x=>x.flags.length).length,on=it.filter(x=>x.on);const tabs=TRK_TABS.filter(t=>it.some(x=>trkMon(x.r.tab)===trkMon(t)));const es=[...new Set(it.map(est))].sort();

    h+='<div class="hseg sm" style="margin:10px 0">'+[['all','All '+it.length],['new','New '+c('new')],['merge','Updates '+c('merge')],['flag','Flagged '+fl],['skip','Skipped '+c('skip')]].map(x=>'<button data-tf="'+x[0]+'"'+(filt===x[0]?' class="on"':'')+'>'+x[1]+'</button>').join('')+'</div>';
    h+='<div class="lscroll tpw"><table class="ltab tpt"><thead><tr><th></th><th>Tab</th><th>Estimator</th><th>Job</th><th>Bid date</th><th>Amount</th><th>Status</th><th>GCs</th><th>Result & follow-ups</th><th>Notes</th></tr></thead><tbody>'+

    $$('[data-on]',m).forEach(b=>b.onchange=()=>{it[+b.dataset.on].on=b.checked;paint()});
    $$('[data-act]',m).forEach(b=>b.onchange=()=>{it[+b.dataset.act].act=b.value});
    $('[data-go]',m).onclick=()=>{m.close();trkSave(P)}};
  paint()}
async function trkSave(P){const sel=P.items.filter(x=>x.on&&x.action!=='skip'),src='tracker-'+P.yr;const news=sel.filter(x=>x.action==='new'||x.act==='new').map(x=>trkRow(x.r,x.pm,src)),ups=sel.filter(x=>x.action==='merge'&&x.act!=='new');
  const pb=progressBox('Saving bids…');let added=0,upd=0,bad=0;
  for(let i=0;i<news.length;i+=50){pb.set('Adding bids '+(i+1)+'–'+Math.min(i+50,news.length)+' of '+news.length+'…');try{await q(sb.from('jobs').insert(news.slice(i,i+50)));added+=Math.min(50,news.length-i)}catch(e){bad++;toast(errMsg(e))}}
  for(const x of ups){pb.set('Updating '+x.match.name+'…');try{await q(sb.from('jobs').update(x.patch).eq('id',x.match.id));upd++}catch(e){bad++}}
  pb.close();await loadJobs();lsSet('crewplans.homeSec','bids');lsSet('crewplans.bidView','all');if(S.view!=='job'){S.view='jobs';render()}
  toast('Imported '+added+' bid'+(added===1?'':'s')+(upd?', updated '+upd:'')+'.'+(bad?' Some rows didn’t save; run the import again to retry them.':''))}

/* download a whole job as one ZIP (for filing in OneDrive) */
const csvCell=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCsv=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
const fileSafe=t=>String(t||'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,80)||'file';
const fmtDate=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString()};
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>rej(new Error('image'));i.src=url})}
function drawSheet(img,marks,pins){
  const W=img.naturalWidth,H=img.naturalHeight,M=Math.max(W,H);const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(img,0,0);g.globalCompositeOperation='multiply';
  for(const m of marks){const col=phase(m.phase).c;const sw=clamp(num(m.w,.006),.001,.03)*M;const {kind,p}=markGeom(m);
    if(kind==='box'&&p.length>=4){g.globalAlpha=.28;g.fillStyle=col;g.fillRect(p[0]*W,p[1]*H,(p[2]-p[0])*W,(p[3]-p[1])*H);g.globalAlpha=.85;g.strokeStyle=col;g.lineWidth=sw/2;g.strokeRect(p[0]*W,p[1]*H,(p[2]-p[0])*W,(p[3]-p[1])*H)}
    else if(p.length>=4){g.globalAlpha=.6;g.strokeStyle=col;g.lineWidth=sw;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(p[0]*W,p[1]*H);for(let i=2;i+1<p.length;i+=2)g.lineTo(p[i]*W,p[i+1]*H);g.stroke()}}
  g.globalCompositeOperation='source-over';g.globalAlpha=1;const r=M*.009;
  pins.forEach((pn,i)=>{const x=clamp(num(pn.x),0,1)*W,y=clamp(num(pn.y),0,1)*H;const col=pn.status==='done'?'#2e7d32':({issue:'#d32f2f',question:'#f59e0b',extra:'#0f766e',note:'#475569'})[pinKind(pn.kind).k];
    g.beginPath();g.arc(x,y-r*1.4,r,0,Math.PI*2);g.fillStyle=col;g.fill();g.lineWidth=r*.18;g.strokeStyle='#fff';g.stroke();
    g.fillStyle='#fff';g.font='bold '+Math.round(r*1.1)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(String(i+1),x,y-r*1.4)});
  return c;
}
async function downloadJob(){
  const job=S.job;const pb=progressBox('Getting ready…');
  try{
    pb.set('Loading tools…');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    pb.set('Collecting job data…');
    const [sheets,marks,pins,areas,logs,members]=await Promise.all([
      q(sb.from('sheets').select('*').eq('job_id',job.id).eq('is_current',true).order('sort')),
      q(sb.from('marks').select('*').eq('job_id',job.id).eq('layer','plans').order('created_at')),
      q(sb.from('pins').select('*').eq('job_id',job.id).eq('layer','plans').order('created_at')),
      q(sb.from('areas').select('*').eq('job_id',job.id).order('created_at')),
      q(sb.from('logs').select('*').eq('job_id',job.id).order('date')),
      q(sb.from('members').select('*').eq('job_id',job.id))]);
    members.forEach(m=>S.people[m.user_id]=m.name);
    const base=fileSafe(job.name);const zip=new window.JSZip();const top=zip.folder(base+' - Alpha Operations '+today());
    const {jsPDF}=window.jspdf;let pdf=null;const pinRows=[['Sheet','Pin #','Type','Status','Note','Added by','Added','Done by','Done','Photos']];
    const photosDir=top.folder('Photos');
    for(let i=0;i<sheets.length;i++){
      const sh=sheets[i];pb.set('Drawing sheet '+(i+1)+' of '+sheets.length+'…');
      const sm=marks.filter(m=>m.sheet_id===sh.id),sp=pins.filter(p=>p.sheet_id===sh.id);
      let canvas=null;try{const [u]=await urlsFor([sh.path]);const img=await loadImg(u);canvas=drawSheet(img,sm,sp)}catch(e){}
      if(canvas){const W=canvas.width,H=canvas.height;const pw=W/5,ph=H/5;const data=canvas.toDataURL('image/jpeg',.85);
        if(!pdf)pdf=new jsPDF({orientation:pw>ph?'landscape':'portrait',unit:'pt',format:[pw,ph]});else pdf.addPage([pw,ph],pw>ph?'landscape':'portrait');
        pdf.addImage(data,'JPEG',0,0,pw,ph,undefined,'FAST');pdf.setFontSize(9);pdf.setTextColor(90);pdf.text(job.name+' · '+sh.name,8,ph-6);canvas.width=canvas.height=0}
      for(let k=0;k<sp.length;k++){const pn=sp[k];const names=[];const ph=Array.isArray(pn.photos)?pn.photos:[];
        for(let j=0;j<ph.length;j++){try{const [u]=await urlsFor([ph[j]]);const b=await (await fetch(u)).blob();const nm=fileSafe(sh.name+' pin '+(k+1)+(ph.length>1?' ('+(j+1)+')':''))+'.jpg';photosDir.file(nm,b);names.push(nm)}catch(e){}}
        pinRows.push([sh.name,k+1,pinKind(pn.kind).n,pn.status==='done'?'Done':'Open',pn.text,who(pn.created_by),fmtDate(pn.created_at),pn.done_by?who(pn.done_by):'',pn.done_at?fmtDate(pn.done_at):'',names.join('; ')])}
    }
    pb.set('Writing the files…');
    if(pdf)top.file(base+' - Marked-up plans.pdf',pdf.output('blob'));
    top.file(base+' - Pins.csv',toCsv(pinRows));
    const sc=PHASES;top.file(base+' - Progress.csv',toCsv([['Area'].concat(sc.map(p=>p.n+' %')).concat(['Last updated','Updated by'])].concat(areas.map(a=>[a.name].concat(sc.map(p=>areaPct(a,p.k))).concat([a.updated_at?fmtDate(a.updated_at):'',a.updated_by?who(a.updated_by):''])))));
    top.file(base+' - Daily logs.csv',toCsv([['Date','Foreman','Crew on site','Man-hours','Work done','Material delivered','Delays / notes']].concat(logs.map(l=>[l.date,who(l.user_id),num(l.crew),num(l.hours),l.work,(l.materials||[]).length?l.materials.map(matRowText).join('; '):l.deliveries,l.notes]))));
    top.file('README.txt','Alpha Operations export for '+job.name+(job.addr?' ('+job.addr+')':'')+'\r\nExported '+new Date().toLocaleString()+'\r\n\r\nMarked-up plans.pdf - every sheet with crew markups; numbered pins match Pins.csv.\r\nScope colors: '+sc.map(p=>p.n).join(', ')+'\r\nPhotos - pin photos, named by sheet and pin number.\r\n');
    const blob=await zip.generateAsync({type:'blob'},m=>pb.set('Zipping… '+Math.round(m.percent)+'%'));
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=base+' - Alpha Operations '+today()+'.zip';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000);
    pb.close();toast('Downloaded. Save it to the job\'s OneDrive folder.');
  }catch(e){pb.close();toast("Couldn't build the download: "+errMsg(e))}
}

/* SOV dollars per scope item (office only); crews only get each item's weight */
function sovEditor(){
  const B=Object.assign({},S.budget||{});
  const m=modal('<h2>Schedule of Values for '+esc(S.job.name)+'</h2><p class="muted" style="margin-top:0">Dollar value of each scope item. Only office accounts see dollars; crews see percents. Leave an item at 0 if its cost is carried in another line.</p>'+
    PHASES.map(p=>'<label class="lrow"><span class="dot" style="background:'+p.c+'"></span><span class="grow">'+esc(p.n)+'</span><span class="muted">$</span><input data-k="'+p.k+'" type="number" inputmode="decimal" min="0" step="1" value="'+(num(B[p.k])||'')+'" placeholder="0" style="width:120px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:right"></label>').join('')+
    '<div class="row" style="margin-top:10px"><b class="grow">Total</b><b data-tot></b></div>'+
    '<div class="mbtns"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>');
  const tot=()=>{$('[data-tot]',m).textContent=money($$('[data-k]',m).reduce((a,i)=>a+num(i.value),0))};tot();
  $$('[data-k]',m).forEach(i=>i.oninput=tot);
  $('[data-x]',m).onclick=()=>m.close();
  $('[data-ok]',m).onclick=async()=>{
    const amounts={};$$('[data-k]',m).forEach(i=>{const v=Math.max(0,Math.round(num(i.value)));if(v)amounts[i.dataset.k]=v});
    const sum=Object.values(amounts).reduce((a,b)=>a+b,0);
    const sc=normScope(S.job.scope).map(p=>Object.assign({},p,{w:sum?Math.round((amounts[p.k]||0)/sum*10000)/10000:0}));
    if(!await run(sb.from('job_budget').upsert({job_id:S.job.id,amounts,updated_at:new Date().toISOString()},{onConflict:'job_id'})))return;
    if(await run(sb.from('jobs').update({scope:sc}).eq('id',S.job.id),'SOV values saved.')){S.job.scope=sc;PHASES=normScope(sc);S.budget=amounts;m.close();render();loadJobs()}
  };
}

async function addForemanToJob(){
  let list=[];try{list=(await q(sb.rpc('foreman_accounts')))||[]}catch(e){toast(errMsg(e));return}
  const on=new Set((S.members||[]).map(x=>x.user_id));list=list.filter(x=>!on.has(x.user_id));
  if(!list.length){toast('No other foreman logins yet. Invite the foreman with a link; he makes his login from ⏱ Time cards.');return}
  const v=await formBox('Add a foreman to '+S.job.name,[{k:'u',label:'Foreman',type:'select',value:list[0].user_id,options:list.map(x=>[x.user_id,x.name+' ('+x.email+')'])}],'Add to job');
  if(!v)return;const f=list.find(x=>x.user_id===v.u);if(!f)return;
  const r=await sb.rpc('add_foreman',{j:S.job.id,u:f.user_id,n:f.name});if(r.error){toast(errMsg(r.error));return}
  toast(f.name+' added. The job shows up next time he opens the app.');loadMembers();
}

function offSig(list){return (list||[]).map(s=>s.id+':'+s.path).sort().join('|')}
function offSaved(id){const v=lsGet('acv.saved.'+id);if(!v)return null;try{const o=JSON.parse(v);if(o&&o.at)return o}catch(e){}return {at:v,sig:null}}
async function idbDelWhere(store,pred){try{await idbDo(store,'readwrite',st=>{const r=st.openCursor();r.onsuccess=()=>{const c=r.result;if(!c)return;if(pred(c.key))c.delete();c.continue()}})}catch(e){}}
async function removeJobOffline(){
  const job=S.job;if(!job)return;
  const waiting=myOps().filter(o=>(o.body&&typeof o.body==='string'&&o.body.includes(job.id))||(o.path&&o.path.startsWith(job.id+'/'))||o.kind==='rpc').length;
  if(waiting){toast(waiting+' change'+(waiting>1?'s':'')+' on this job still need to upload. Get signal, let them sync, then remove.');return}
  if(!await confirmBox('Remove the saved plans for '+job.name+' from this device? You can save them again any time you have signal.','Remove'))return;
  let before=0;try{before=(await navigator.storage.estimate()).usage}catch(e){}
  const ids=new Set([job.id].concat(S.sheets.map(x=>x.id)));
  await idbDelWhere('img',k=>String(k).startsWith(job.id+'/'));
  await idbDelWhere('resp',k=>{const m=String(k).match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi)||[];return m.some(x=>ids.has(x))&&!/\/rest\/v1\/jobs\?/.test(k)});
  Object.keys(S.urls).forEach(p=>{if(p.startsWith(job.id+'/')){if(S.urls[p].startsWith('blob:'))try{URL.revokeObjectURL(S.urls[p])}catch(e){}delete S.urls[p]}});
  lsSet('acv.saved.'+job.id,null);
  let freed='';try{const after=(await navigator.storage.estimate()).usage;if(before>after)freed=' Freed about '+Math.max(1,Math.round((before-after)/1048576))+' MB.'}catch(e){}
  toast('Removed from this device.'+freed);render();
}
async function saveJobOffline(){
  if(navigator.onLine===false){toast('Connect to Wi-Fi or signal first, then save the job.');return}
  const job=S.job;if(!job)return;const pb=progressBox('Saving job info…');
  try{
    try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
    await Promise.all([loadSheets(),loadAreas(),loadLogs(),loadMembers()]);
    const list=curSheets();const photos=[];let bad=0;
    for(let i=0;i<list.length;i++){const s=list[i];pb.set('Saving sheet '+(i+1)+' of '+list.length+'…');
      try{const ls=s.on_progress?['plans','progress']:['plans'];const rs=await Promise.all(ls.flatMap(l=>[q(marksQ(s.id,l)),q(pinsQ(s.id,l))]));rs.filter((_,k)=>k%2).map(x=>x||[]).flat().forEach(p=>(Array.isArray(p.photos)?p.photos:[]).forEach(x=>photos.push(x)))}catch(e){bad++}
      const us=await urlsFor([s.path,s.thumb_path].filter(Boolean),true);if(!us[0]||!us[0].startsWith('blob:'))bad++}
    if(photos.length){pb.set('Saving '+photos.length+' pin photo'+(photos.length>1?'s':'')+'…');await urlsFor(photos,true)}
    pb.close();
    if(bad){toast("Some sheets didn't save. Check your signal and tap Save for offline again.");return}
    lsSet('acv.saved.'+job.id,JSON.stringify({at:new Date().toISOString(),sig:offSig(list)}));
    let mb='';try{const e=await navigator.storage.estimate();mb=' About '+Math.round(e.usage/1048576)+' MB used on this device.'}catch(e){}
    toast('Saved for offline: '+list.length+' sheet'+(list.length===1?'':'s')+'.'+mb);if(S.tab==='plans')render();
  }catch(e){pb.close();toast(errMsg(e))}
}

/* ===== Scan & fix sheets (office only): names, revision marks, duplicates, RFI/PR/ASI links ===== */
const DOC_RE=/^(RFI|ASI|PR|CCD|PCO|ADD(?:ENDUM)?|BULLETIN|SK)\s*#?\s*(\d{1,4})(?:\s*R(?:EV)?\s*(\d{1,2}))?(?=[-\s–_.]|$)/i;
function docInfo(s){const m=String(sheetNo(s)||s.name||'').match(DOC_RE);if(!m)return null;let ty=m[1].toUpperCase();if(/^ADD/.test(ty))ty='Addendum';if(ty==='BULLETIN')ty='Bulletin';return {key:ty+m[2]+(m[3]?'R'+m[3]:''),label:ty+' '+(+m[2])+(m[3]?' Rev '+(+m[3]):'')}}
const genericName=s=>!/\s[–-]\s/.test(s.name||'')||/^(sheet|page)\s*\d+/i.test(s.name||'');
async function ocrLines(c,psm){const w=await loadOcr();const run=async()=>{await w.setParameters({tessedit_pageseg_mode:String(psm||3)});const r=await w.recognize(c);return (r.data.lines||[]).map(l=>String(l.text||'').trim()).filter(Boolean)};const p=ocrBusy.then(run,run);ocrBusy=p.catch(()=>{});return p}
async function sheetImage(s){const [u]=await urlsFor([s.path]);const img=new Image();img.crossOrigin='anonymous';await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=u});return img}
async function readForOrganize(s,opt){
  const img=await sheetImage(s);const W=img.naturalWidth||img.width;const out={num:null,title:null,cands:[],revLines:[],docLines:[]};
  if(opt.name){try{const o=await nameFromImage(img);Object.assign(out,{num:o.num,title:o.title,cands:o.cands})}catch(e){}}
  if(opt.rev){const sc=Math.min(1.4,2400/Math.max(1,W*.2));out.revLines=(await ocrLines(cropFrom(img,.8,0,1,1,0,sc),3)).concat(await ocrLines(cropFrom(img,.5,.8,1,1,0,Math.min(1.2,2400/Math.max(1,W*.5))),3))}
  if(opt.doc){out.docLines=await ocrLines(cropFrom(img,0,0,1,1,0,Math.min(1,2200/Math.max(1,W))),3)}
  return out;

const payNum=v=>{if(typeof v==='number')return isFinite(v)?v:null;if(v==null||v instanceof Date)return null;const s=String(v).replace(/[$,\s]/g,'');if(!s||s==='-')return null;const m=s.match(/^\((.*)\)$/);const n=Number(m?m[1]:s);return isFinite(n)?(m?-n:n):null};
const PAY_TOT=/^(ORIGINAL CONTRACT|CHANGE ORDERS?|REVISED CONTRACT|GRAND|CONTRACT) TOTALS?\b|^TOTALS?:?$/;
const PAY_MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
/* a cell as YYYY-MM-DD: Date (read as UTC, the way Excel dates come in), Excel serial number, or text like 11/30/2026 or 2026-11-30 */
function payDate(v){if(v==null||v==='')return '';if(v instanceof Date)return isNaN(v)?'':v.toISOString().slice(0,10);
  if(typeof v==='number'){if(v<1||v>2958465)return '';return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10)}
  const s=String(v).trim();let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')}
  const t=Date.parse(s);return isNaN(t)?'':new Date(t).toISOString().slice(0,10)}
function payHeadRow(rows){for(let r=0;r<rows.length;r++){const t=(rows[r]||[]).map(payTxt);if(t.some(x=>x.includes('DESCRIPTION OF WORK'))&&t.some(x=>x.includes('SCHEDULED VALUE')))return r}return -1}
/* sheets = [{name, rows:[[cell values]]}] (0-based). Lines: rows after the header with a description and a scheduled value, up to ORIGINAL CONTRACT TOTALS; after it, change order rows only if their scheduled value isn’t 0; total rows skipped; stop at REVISED CONTRACT TOTALS. */
function payAppLines(sheets){
  const sh=(sheets||[]).find(s=>/continuation/i.test(s.name||'')&&payHeadRow(s.rows||[])>=0)||(sheets||[]).find(s=>payHeadRow(s.rows||[])>=0);
  if(!sh)throw new Error('No Continuation Sheet found (no sheet with a DESCRIPTION OF WORK and SCHEDULED VALUE header).');
  const rows=sh.rows,hr=payHeadRow(rows);
  const col=re=>{for(const r of [hr,hr+1,hr-1]){const t=(rows[r]||[]).map(payTxt);const i=t.findIndex(x=>re.test(x));if(i>=0)return i}return -1};
  const C={item:col(/LINE ITEM|ITEM NO|^ITEM\b/),desc:col(/DESCRIPTION OF WORK/),sv:col(/SCHEDULED VALUE/),prev:col(/FROM PREVIOUS/),per:col(/THIS PERIOD/),stored:col(/PRESENTLY STORED/),todate:col(/COMPLETED AND STORED TO DATE|COMPLETED & STORED TO DATE/)};
  const lines=[];let co=false,origTot=null,coTot=null,revTot=null;const cell=(row,c)=>c>=0?row[c]:null;
  for(let r=hr+1;r<rows.length;r++){const row=rows[r]||[];const tot=row.map(payTxt).find(x=>PAY_TOT.test(x));
    if(tot){const v=payNum(cell(row,C.sv));if(/^ORIGINAL/.test(tot)){origTot=v;co=true}else if(/^CHANGE/.test(tot))coTot=v;else{revTot=v;break}continue}
    const d=String(cell(row,C.desc)==null?'':cell(row,C.desc)).replace(/\s+/g,' ').trim();const it=String(cell(row,C.item)==null?'':cell(row,C.item)).replace(/\s+/g,' ').trim();const v=payNum(cell(row,C.sv));
    if(!d||v==null||/^DESCRIPTION OF WORK/i.test(d))continue;if(co&&!v)continue;
    const g=payNum(cell(row,C.todate));const to=g!=null?g:[C.prev,C.per,C.stored].reduce((a,c)=>a+num(payNum(cell(row,c))),0);
    const n=/^C\.?\s*O\.?\s*#?\s*\d/i.test(it)&&billKey(d).indexOf(billKey(it))!==0?it+' '+d:d;
    lines.push({n,v:r2(v),to:r2(to),pct:v?Math.min(100,Math.max(0,r2(to/v*100))):0,row:r+1,co})}

/* Payment sheet (G702): APPLICATION NO., FOR WORK THROUGH (or PERIOD TO) and CONTRACT SUM TO DATE: the first value right of each label; on a sheet named Payment, N2 / N4 / F21 if a label isn’t found */
function payAppG702(sheets){const sh=(sheets||[]).find(s=>/payment|g702/i.test(s.name||''))||(sheets||[]).find(s=>!/continuation/i.test(s.name||'')&&(s.rows||[]).some(r=>(r||[]).some(x=>/CONTRACT SUM TO DATE/.test(payTxt(x)))));if(!sh)return null;
  const rows=sh.rows||[];const right=(re,ok)=>{for(let r=0;r<rows.length;r++){const row=rows[r]||[];for(let c=0;c<row.length;c++){if(!re.test(payTxt(row[c])))continue;for(let k=c+1;k<row.length;k++){const v=row[k];if(v==null||String(v).trim()===''||/^[:#]$/.test(String(v).trim()))continue;if(ok&&!ok(v))continue;return v}}}return null};
  const at=(r,c)=>(rows[r]||[])[c];const fixed=/payment/i.test(sh.name);
  let no=right(/APPLICATION (NO|NUMBER|#)/,v=>payNum(v)!=null||/\d/.test(String(v)));if(no==null&&fixed)no=at(1,13);
  let thru=right(/FOR WORK THROUGH|PERIOD TO|WORK THRU/,v=>!!payDate(v));if(thru==null&&fixed)thru=at(3,13);
  let sum=right(/CONTRACT SUM TO DATE/,v=>payNum(v)!=null);if(sum==null&&fixed)sum=at(20,5);
  const nn=payNum(no);return {sheet:sh.name,no:nn!=null?String(nn):no==null?'':String(no).trim(),thru:payDate(thru),sum:payNum(sum)}}
/* the whole pay app: lines + G702 + source text, period (YYYY-MM from FOR WORK THROUGH) and the total check */
function payAppParse(sheets){const P=payAppLines(sheets);const G=payAppG702(sheets);P.g702=G;
  P.total=r2(P.lines.reduce((a,l)=>a+l.v,0));P.no=G&&G.no||'';P.thru=G&&G.thru||'';P.period=P.thru?P.thru.slice(0,7):'';
  P.sum=G&&G.sum!=null?G.sum:null;P.match=P.sum==null?null:Math.abs(P.sum-P.total)<0.005;
  P.source='Pay App'+(P.no?' '+P.no:'')+(P.period?' '+PAY_MON[+P.period.slice(5,7)-1]+' '+P.period.slice(0,4):'');return P}
/* new labor.billing from a parsed pay app: its lines, source, loaded_at and history with that period’s entry set (pcts = to date / scheduled); other months kept, re-matched to the new lines by name */
function payAppBilling(old,P,by,now){const lines=P.lines.map(l=>({n:l.n,v:l.v}));const names=lines.map(l=>l.n);const per=P.period||billMonth();
  const oldNames=old&&Array.isArray(old.lines)?old.lines.map(l=>l&&l.n):null;
  const history=((old&&old.history)||[]).filter(h=>h&&h.period&&h.period!==per).map(h=>Object.assign({},h,{pcts:billPcts(h,lines,oldNames),names}));
  history.push({period:per,pcts:P.lines.map(l=>l.pct),names,at:now,by:by||null,from:P.source});history.sort((a,b)=>a.period<b.period?-1:1);
  return {lines,source:P.source,loaded_at:now,history}}
/* ExcelJS workbook -> sheets of cached values (formula results, rich text joined, errors blank) */
const payCell=v=>{if(v==null)return null;if(v instanceof Date||typeof v!=='object')return v;if('result' in v)return payCell(v.result);if(Array.isArray(v.richText))return v.richText.map(t=>t.text).join('');if('text' in v)return v.text;return null};
function payXlsSheets(wb){return (wb.worksheets||[]).map(ws=>{const rows=[];ws.eachRow({includeEmpty:false},(row,rn)=>{const a=[];row.eachCell({includeEmpty:false},(c,cn)=>{a[cn-1]=payCell(c.value)});rows[rn-1]=a});return {name:ws.name,rows}})}
async function billSavePayApp(P){if(!billTabOk()||!S.job)return false;const id=S.job.id;let L;
  try{const d=await q(sb.from('job_budget').select('labor').eq('job_id',id).maybeSingle());L=(d&&d.labor)||{}}catch(e){toast(errMsg(e));return false}
  const bill=payAppBilling(L.billing,P,S.me&&S.me.id,new Date().toISOString());
  const ok=await run(sb.from('job_budget').upsert({job_id:id,labor:Object.assign({},L,{billing:bill})},{onConflict:'job_id'}),'Loaded '+P.lines.length+' pay app line'+(P.lines.length===1?'':'s')+' from '+P.source+'.');
  if(ok&&jobId()===id){S.billing=bill;if(S.labor)S.labor.billing=bill;if(S.jobSize)S.jobSize[id]=P.total;render()}return !!ok}
async function billLoadPayApp(file,opt){opt=opt||{};

  if(!file||!/\.(xlsx|xlsm)$/i.test(file.name||'')){toast('Pick the pay app as an .xlsx file.');return null}

  if(pb)pb.close();

window.billLoadPayApp=billLoadPayApp;

/* ===== Materials vs. the order =====

const MAT_UNITS={sheet:'sheet',sheets:'sheet',sht:'sheet',shts:'sheet',sh:'sheet',ea:'ea',each:'ea',pc:'ea',pcs:'ea',piece:'ea',pieces:'ea',stick:'ea',sticks:'ea',length:'ea',lengths:'ea',lgth:'ea',lgths:'ea',box:'box',boxes:'box',bx:'box',bxs:'box',bundle:'bundle',bundles:'bundle',bdl:'bundle',bdls:'bundle',bucket:'bucket',buckets:'bucket',bkt:'bucket',bkts:'bucket',pail:'bucket',pails:'bucket',roll:'roll',rolls:'roll',rl:'roll',rls:'roll',bag:'bag',bags:'bag',carton:'carton',cartons:'carton',ctn:'carton',ctns:'carton',case:'carton',cases:'carton',cs:'carton',lf:'lf',sf:'sf',tube:'tube',tubes:'tube',gal:'gal',gals:'gal',pallet:'pallet',pallets:'pallet',plt:'pallet'};

/* "001" on a delivery ticket matches PO 328-001 from the PDF */
const matPOEq=(a,b)=>!!a&&!!b&&(a===b||(Math.min(a.length,b.length)>=3&&(a.endsWith(b)||b.endsWith(a))));

/* rows copied from the Excel PO (tab-separated). Uses the header row when there is one (Qty / Unit / Item or Description / Length), else guesses per row. */

function poRows(items){

function poParse(pages){

      if(!inT){

          else if((m=c.s.match(/^job\s*(?:#|no\.?)\s*:?\s*(.*)$/i))){if(!R.job)R.job=(m[1]||nv).slice(0,20)}
          else if((m=c.s.match(/^pm\s*:\s*(.*)$/i))){if(!R.pm)R.pm=(m[1]||nv).slice(0,30)}
          else if((m=c.s.match(/^p\.?\s*o\.?\s*(?:#|no\.?|number)\s*:?\s*(.*)$/i))){if(!R.num&&(m[1]||nv))R.num=(m[1]||nv).slice(0,20)}

        let k='x',ov=0;cols.forEach(h=>{const o=Math.min(c.x+c.w,h.x+h.w)-Math.max(c.x,h.x);if(o>ov){ov=o;k=h.k}});if(!ov)k=near(cols);

function matCalc(M,logs,day){

    ms.forEach(x=>{if(!x||!(x.text||x.qty))return;const p=num(x.qty)>0?{item:String(x.text||''),qty:num(x.qty),unit:String(x.unit||'')}:matParseText(x.text);rows.push(Object.assign({},x,p,{date:String(lg.date||''),by:lg.name||''}))})});

      const po=matPO(r.po);if(po){const c2=c.filter(x=>matPOEq(matPO(x.l.po),po));if(c2.length)c=c2}
      if(c.length){const best=Math.max(...c.map(x=>x.s));c=c.filter(x=>best-x.s<1e-6).sort((a,b)=>(num(b.l.qty)-b.l.got)-(num(a.l.qty)-a.l.got));ln=c[0].l}}

    if(l.st==='over')flags.push({lvl:'over',id:l.id,t:l.item+': '+matQ(g)+' delivered, '+matQ(q)+' ordered'});

function sigPad(cv){
  const x=cv.getContext('2d');let drawing=false,dirty=false,last=null;
  const fitCv=()=>{const r=cv.getBoundingClientRect();if(!r.width)return;const keep=dirty?cv.toDataURL():null;cv.width=Math.round(r.width*2);cv.height=Math.round(r.height*2);x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';if(keep)pad.load(keep)};
  const pt=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;last=pt(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;dirty=true});
  const end=()=>{drawing=false};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  const pad={clear(){x.clearRect(0,0,cv.width,cv.height);dirty=false},
    load(u){if(!u){pad.clear();return}const i=new Image();i.onload=()=>{x.clearRect(0,0,cv.width,cv.height);x.drawImage(i,0,0,cv.width,cv.height);dirty=true};i.src=u},
    get(){if(!dirty)return null;const c=document.createElement('canvas');c.width=480;c.height=Math.round(480*cv.height/cv.width);const g=c.getContext('2d');g.drawImage(cv,0,0,c.width,c.height);return c.toDataURL('image/png')},
    get dirty(){return dirty}};
  requestAnimationFrame(fitCv);return pad;
}
/* ===== T&M tickets =====
   Each extra work row on a daily report (logs.extra_work) can be a T&M ticket: {tm:1,id,no,work,loc,awa,crew:[{name,hrs}],mats:[{item,qty,unit}],photos:[],by (GC rep),sig,signed_at,no_sig,status,co,amt,notes,upd_by,upd_at}.
   Old plain rows {work,by,awa} still show as before. Ticket saves go through the logs table, so offline, practice and view-as work like the rest of the report. */
const TM_ST={unsigned:'Unsigned',signed:'Signed',sent:'Sent to GC',approved:'Approved',rejected:'Rejected'};

const TM_REASONS=['GC not on site','GC will sign later','GC refused to sign'];

const tmSt=t=>TM_OFFICE.includes(t&&t.status)?t.status:(t&&t.sig?'signed':'unsigned');
const tmHrs=t=>r2(((t&&t.crew)||[]).reduce((a,c)=>a+num(c.hrs),0));
const tmIs172=c=>/^\s*0*172\b|extra|t\s*&\s*m/i.test(String(c||''));
const tmBody=t=>JSON.stringify([t.work||'',t.loc||'',(t.crew||[]).map(c=>[c.name||'',num(c.hrs)]),(t.mats||[]).map(m=>[m.item||'',num(m.qty),m.unit||''])]);
const tmOld=(t,date,now)=>tmSt(t)==='unsigned'&&!!date&&date<isoAddD(now,-2);
/** Next ticket number on the job: one more than the highest on any report (plus tickets not saved yet). */
function tmNext(logs,more){let n=0;const see=x=>{if(tmIs(x))n=Math.max(n,num(x.no))};(logs||[]).forEach(l=>(l.extra_work||[]).forEach(see));(more||[]).forEach(see);return n+1}
/** Every ticket on the job with its report, newest number first. Plain old rows are not tickets. */
function tmAll(logs){const out=[];(logs||[]).forEach(l=>(l.extra_work||[]).forEach(t=>{if(tmIs(t))out.push({t,l})}));return out.sort((a,b)=>num(b.t.no)-num(a.t.no)||String(b.l.date).localeCompare(String(a.l.date)))}
/** Crew for a ticket: each worker's hours on this job that day coded 172 (Extra) on the time card. */
function tmCrew172(card,iso,no,nm){const out=[];if(!card||!card.period_start)return out;const d=tcDayIdx(card.period_start,iso);if(d<0)return out;
  (card.workers||[]).forEach(w=>{const h=((w.days&&w.days[d])||[]).reduce((a,l)=>a+(tcIsJob(l,no,nm)&&tmIs172(l&&l.code)?tcHrs(l):0),0);if(h>0)out.push({name:String(w.name||'').trim()||'Worker',hrs:r2(h)})});return out}
/** Time card 172 hours not already on the day’s other tickets (so two tickets the same day don’t both claim them). */
function tmLeft(crew,others){const used={};(others||[]).forEach(t=>(t.crew||[]).forEach(c=>{const k=String(c.name||'').trim().toLowerCase();used[k]=(used[k]||0)+num(c.hrs)}));
  return (crew||[]).map(c=>{const k=String(c.name||'').trim().toLowerCase();const h=r2(num(c.hrs)-(used[k]||0));used[k]=Math.max(0,(used[k]||0)-num(c.hrs));return {name:c.name,hrs:h}}).filter(c=>c.hrs>0)}
/** GC signs on the phone: Unsigned -> Signed (an office status like Approved stays). */
function tmSign(t,name,sig,when){if(!sig||!String(name||'').trim())throw new Error('Signature and GC name needed');const n=Object.assign({},t,{by:String(name).trim().slice(0,60),sig,signed_at:when,no_sig:null});if(!TM_OFFICE.includes(n.status))n.status='signed';return n}
function tmUnsign(t){const n=Object.assign({},t,{sig:null,signed_at:null});if(!TM_OFFICE.includes(n.status))n.status='unsigned';return n}
/** Office sets Sent / Approved / Rejected, or 'open' to go back to Signed/Unsigned (from the signature). Also GC CO #, approved $ and notes. */
function tmSetStatus(t,s,o){o=o||{};if(s!=='open'&&!TM_OFFICE.includes(s))throw new Error('Unknown status: '+s);const n=Object.assign({},t);n.status=s==='open'?(t.sig?'signed':'unsigned'):s;
  ['co','notes'].forEach(k=>{if(o[k]!=null)n[k]=String(o[k]).trim().slice(0,k==='co'?40:1000)});if(o.amt!=null)n.amt=String(o.amt).trim()===''?null:r2(num(String(o.amt).replace(/[$,\s]/g,'')));
  if(o.by)n.upd_by=o.by;if(o.at)n.upd_at=o.at;return n}
/** The foreman's copy of the rows wins, but the office's fields (status, CO #, $, notes) and a newer GC signature come from the saved copy. Office-handled tickets can't be dropped. */
function tmMerge(mine,saved){const sv={};(saved||[]).forEach(x=>{if(tmIs(x)&&x.id)sv[x.id]=x});const seen=new Set();
  const out=(mine||[]).map(x=>{const s=tmIs(x)&&x.id&&sv[x.id];if(!s)return x;seen.add(x.id);const n=Object.assign({},x);['co','amt','notes','upd_by','upd_at'].forEach(k=>{if(s[k]!==undefined)n[k]=s[k]});
    if(s.sig&&!n.sig&&tmBody(s)===tmBody(n))Object.assign(n,{sig:s.sig,signed_at:s.signed_at,by:s.by,no_sig:null});if(TM_OFFICE.includes(s.status))n.status=s.status;else if(!TM_OFFICE.includes(n.status))n.status=n.sig?'signed':'unsigned';return n});
  Object.keys(sv).forEach(id=>{if(!seen.has(id)&&TM_OFFICE.includes(sv[id].status))out.push(sv[id])});return out}

/* printed scale(s) in a PDF page's text, stored on the sheet as sheets.scale_text: best first, '; ' between, e.g. 3/32" = 1'-0"; 1/4" = 1'-0" */

/* sheets uploaded before scales were read (scale_text null): read the scale label off the picture, lower half first, and save it ('' = none found) */

    V.g=null;
    if(g.type==='draw'){if(e.type!=='pointercancel'&&g.moved)commitDraw(g);clearLive();return}
    if(g.type==='pan'&&!g.moved&&e.type!=='pointercancel'&&Date.now()-g.time<600)tap(e.clientX,e.clientY);
  };
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  st.addEventListener('wheel',e=>{if(!V||!V.W)return;e.preventDefault();const r=V.stage.getBoundingClientRect();const s=clamp(V.t.s*Math.exp(-e.deltaY*.0015),V.minS,4);const ix=(e.clientX-r.left-V.t.x)/V.t.s,iy=(e.clientY-r.top-V.t.y)/V.t.s;V.t={s,x:e.clientX-r.left-ix*s,y:e.clientY-r.top-iy*s};applyT()},{passive:false});
}
const r4=v=>Math.round(clamp(v,0,1)*10000)/10000;
function penW(){return V.pen==='thick'?.012:.006}
function drawLive(){
  const g=V.g;const c=phase(V.phase).c;const sw=penW()*Math.max(V.W,V.H);let s='';
  if(V.mode==='straight')s='<line x1="'+g.start.x.toFixed(1)+'" y1="'+g.start.y.toFixed(1)+'" x2="'+g.end.x.toFixed(1)+'" y2="'+g.end.y.toFixed(1)+'" stroke="'+c+'" stroke-opacity=".6" stroke-width="'+sw+'" stroke-linecap="round"/>';
  else if(V.mode==='line')s='<polyline points="'+g.pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')+'" fill="none" stroke="'+c+'" stroke-opacity=".6" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round"/>';
  else{const x=Math.min(g.start.x,g.end.x),y=Math.min(g.start.y,g.end.y),w=Math.abs(g.end.x-g.start.x),h=Math.abs(g.end.y-g.start.y);s='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'" fill-opacity=".3" stroke="'+c+'" stroke-width="'+(sw/2)+'"/>'}
  $('#liveG').innerHTML=s;
}
/* straight lines snap to level/plumb (and 45°) when close */
function snapLine(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(!len)return b;const ang=Math.atan2(dy,dx);const step=Math.PI/4;const near=Math.round(ang/step)*step;if(Math.abs(ang-near)<7*Math.PI/180)return {x:a.x+len*Math.cos(near),y:a.y+len*Math.sin(near)};return b}
function clearLive(){const l=$('#liveG');if(l)l.innerHTML=''}
async function commitDraw(g){
  let pts;
  if(V.mode==='straight'){const a=g.start,b=g.end;if(dist(a,b)<6/V.t.s)return;pts=[r4(a.x/V.W),r4(a.y/V.H),r4(b.x/V.W),r4(b.y/V.H)]}
  else if(V.mode==='line'){if(g.pts.length<2)return;pts=[];g.pts.forEach(p=>pts.push(r4(p.x/V.W),r4(p.y/V.H)))}
  else{const a=g.start,b=g.end;if(Math.abs(a.x-b.x)<4/V.t.s||Math.abs(a.y-b.y)<4/V.t.s)return;pts=[r4(Math.min(a.x,b.x)/V.W),r4(Math.min(a.y,b.y)/V.H),r4(Math.max(a.x,b.x)/V.W),r4(Math.max(a.y,b.y)/V.H)]}
  if(pts.length>3000)pts=pts.slice(0,3000);
  const row={id:uuid(),job_id:S.job.id,sheet_id:V.id,layer:V.layer,kind:V.mode==='box'?'box':'line',phase:V.phase,pts,w:penW(),created_at:new Date().toISOString()};
  V.marks.push(row);drawMarks();V.mine.push(row.id);syncTools();
  const sheetId=V.id;const ok=await run(sb.from('marks').insert(row));if(ok&&row.layer==='progress'&&S.nudges&&S.nudges[row.job_id]){delete S.nudges[row.job_id]}
  if(!ok&&V&&V.id===sheetId){V.marks=V.marks.filter(m=>m.id!==row.id);V.mine=V.mine.filter(i=>i!==row.id);drawMarks();syncTools()}
}
async function undo(){const id=V.mine.pop();syncTools();if(!id)return;V.marks=V.marks.filter(m=>m.id!==id);drawMarks();await run(sb.from('marks').delete().eq('id',id))}
function markGeom(m){return {kind:m.kind==='box'?'box':'line',p:Array.isArray(m.pts)?m.pts.map(v=>num(v)):[]}}
function drawMarks(){
  const g=$('#marksG');if(!g||!V.W)return;const M=Math.max(V.W,V.H);
  g.innerHTML=V.marks.filter(m=>!S.hidden.has(phase(m.phase).k)).map(m=>{
    const c=phase(m.phase).c;const sw=clamp(num(m.w,.006),.001,.03)*M;const {kind,p}=markGeom(m);
    const dash=m.from_rev?' stroke-dasharray="'+(sw*2.2).toFixed(1)+' '+(sw*1.6).toFixed(1)+'"':'';
    if(kind==='box'){if(p.length<4)return '';return '<rect x="'+p[0]*V.W+'" y="'+p[1]*V.H+'" width="'+Math.max(0,(p[2]-p[0])*V.W)+'" height="'+Math.max(0,(p[3]-p[1])*V.H)+'" fill="'+c+'" fill-opacity="'+(m.from_rev?'.14':'.28')+'" stroke="'+c+'" stroke-opacity=".85" stroke-width="'+(sw/2)+'"'+dash+'/>'}
    if(p.length<4)return '';let s='';for(let i=0;i+1<p.length;i+=2)s+=(p[i]*V.W).toFixed(1)+','+(p[i+1]*V.H).toFixed(1)+' ';
    return '<polyline points="'+s+'" fill="none" stroke="'+c+'" stroke-opacity="'+(m.from_rev?'.45':'.6')+'" stroke-width="'+sw+'" stroke-linecap="'+(m.from_rev?'butt':'round')+'" stroke-linejoin="round"'+dash+'/>';
  }).join('');
}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function nearestMark(pt){
  const tol=22/V.t.s;let best=null,bd=Infinity;const M=Math.max(V.W,V.H);
  for(const m of V.marks){if(S.hidden.has(phase(m.phase).k))continue;const {kind,p}=markGeom(m);let d=Infinity;
    if(kind==='box'&&p.length>=4){const x1=p[0]*V.W,y1=p[1]*V.H,x2=p[2]*V.W,y2=p[3]*V.H;if(pt.x>=x1&&pt.x<=x2&&pt.y>=y1&&pt.y<=y2)d=0;else d=Math.min(segDist(pt.x,pt.y,x1,y1,x2,y1),segDist(pt.x,pt.y,x2,y1,x2,y2),segDist(pt.x,pt.y,x2,y2,x1,y2),segDist(pt.x,pt.y,x1,y2,x1,y1))}
    else{for(let i=0;i+3<p.length;i+=2)d=Math.min(d,segDist(pt.x,pt.y,p[i]*V.W,p[i+1]*V.H,p[i+2]*V.W,p[i+3]*V.H));d-=clamp(num(m.w,.006),.001,.03)*M/2}
    if(d<bd){bd=d;best=m}}
  return bd<=tol?best:null;
}
async function tap(cx,cy){
  const p=toImg(cx,cy);if(p.x<0||p.y<0||p.x>V.W||p.y>V.H)return;
  if(V.mode==='pin'&&canPin())pinDialog(null,{x:r4(p.x/V.W),y:r4(p.y/V.H)});
  else if(V.mode==='erase'&&canWrite()){const m=nearestMark(p);if(!m){toast('No markup there. Zoom in and tap right on it.');return}
    if(await confirmBox('Erase this '+phase(m.phase).n+' '+(m.kind==='box'?'area':'highlight')+'?','Erase')){if(V){V.marks=V.marks.filter(x=>x.id!==m.id);drawMarks()}await run(sb.from('marks').delete().eq('id',m.id))}}
}
function visiblePins(){return V.pins.filter(p=>S.pinFilter==='all'||(S.pinFilter==='open'&&p.status!=='done'))}
function buildPins(){
  const L=$('#pinLayer');if(!L||!V||!V.W)return;
  L.innerHTML=visiblePins().map(p=>{const k=pinKind(p.kind);return '<button class="pin '+k.k+(p.status==='done'?' done':'')+'" data-id="'+esc(p.id)+'" aria-label="'+esc(k.n)+'"'+(p.from_rev?' style="outline:2px dashed #ea580c;outline-offset:2px" title="From Rev '+num(p.from_rev,1)+'"':'')+'>'+(p.status==='done'?'✓':k.i)+'</button>'}).join('');
  $$('.pin',L).forEach(b=>b.onclick=()=>{const p=V.pins.find(x=>x.id===b.dataset.id);if(p)pinDialog(p)});placePins();
}
function placePins(){if(!V||!V.W)return;$$('#pinLayer .pin').forEach(b=>{const p=V.pins.find(x=>x.id===b.dataset.id);if(!p)return;const x=clamp(num(p.x),0,1)*V.W*V.t.s+V.t.x,y=clamp(num(p.y),0,1)*V.H*V.t.s+V.t.y;b.style.transform='translate('+x+'px,'+y+'px)'})}
let layersM=null;
function layersPanel(){
  if(layersM){layersM.close();return}
  const counts={};V.marks.forEach(m=>{const k=phase(m.phase).k;counts[k]=(counts[k]||0)+1});const open=V.pins.filter(p=>p.status!=='done').length;
  const m=modal('<h2 style="display:flex;align-items:center"><span class="grow">Layers</span><button class="ico" data-close aria-label="Close">✕</button></h2>'+PHASES.map(p=>'<label class="lrow"><input type="checkbox" data-ph="'+p.k+'" '+(S.hidden.has(p.k)?'':'checked')+'><span class="dot" style="background:'+p.c+'"></span><span class="grow">'+p.n+'</span><span class="muted">'+(counts[p.k]||0)+' marks</span></label>').join('')+
    '<div style="margin-top:14px"><b>Pins</b> <span class="muted small">('+open+' open of '+V.pins.length+')</span></div><div class="chips" style="margin-top:8px">'+[['all','All'],['open','Open only'],['none','Hide']].map(([k,n])=>'<button class="chip'+(S.pinFilter===k?' on':'')+'" data-pf="'+k+'">'+n+'</button>').join('')+'</div>'+
    '<div class="legend"><span><span class="dot" style="background:#d32f2f"></span>Issue</span><span><span class="dot" style="background:#f59e0b"></span>Question</span><span><span class="dot" style="background:#0f766e"></span>Extra work</span><span><span class="dot" style="background:#475569"></span>Note</span><span><span class="dot" style="background:#2e7d32"></span>Done</span></div>'+
    (innerWidth>=900?'<div class="vprow" style="margin-top:12px"><div class="vplab">Tool bar<span>Where the drawing tools sit on wide screens (this device)</span></div><div class="hseg sm">'+[['bottom','Bottom'],['right','Right']].map(x=>'<button type="button" data-vtp="'+x[0]+'"'+(vwTools()===x[0]?' class="on"':'')+'>'+x[1]+'</button>').join('')+'</div></div>':'')+
    '<div class="mbtns"><button class="btn primary" data-x>Done</button></div>',()=>{layersM=null;document.removeEventListener('keydown',esc1)});
  $$('[data-vtp]',m).forEach(b=>b.onclick=()=>{viewSet('viewer',{tools:b.dataset.vtp},{tools:'bottom'});vwApply();$$('[data-vtp]',m).forEach(x=>x.classList.toggle('on',x===b));fit()});
  const esc1=e=>{if(e.key==='Escape')m.close()};document.addEventListener('keydown',esc1);layersM=m;
  $$('[data-ph]',m).forEach(c=>c.onchange=()=>{c.checked?S.hidden.delete(c.dataset.ph):S.hidden.add(c.dataset.ph);drawMarks()});
  $$('[data-pf]',m).forEach(b=>b.onclick=()=>{S.pinFilter=b.dataset.pf;$$('[data-pf]',m).forEach(x=>x.classList.toggle('on',x===b));buildPins()});
  $('[data-x]',m).onclick=()=>m.close();$('[data-close]',m).onclick=()=>m.close();
}
function pinDialog(pin,at){
  const isNew=!pin;const jid=S.job.id,sheetId=V.id,lay=V.layer;const ro=V.sh.is_current===false||!(canWrite()||(S.role==='viewer'&&(isNew||pin.created_by===S.me.id)));
  let kind=isNew?'issue':pinKind(pin.kind).k;let photos=isNew?[]:(Array.isArray(pin.photos)?pin.photos.filter(p=>typeof p==='string'):[]);
  const m=modal('<h2>'+(isNew?'New pin':esc(pinKind(pin.kind).n))+'</h2><div class="chips">'+PIN_KINDS.map(k=>'<button class="chip" data-k="'+k.k+'" '+(ro?'disabled':'')+'>'+k.n+'</button>').join('')+'</div>'+
    '<label class="field"><span>Note</span><textarea data-text '+(ro?'readonly':'')+' placeholder="What\'s going on here?">'+esc(isNew?'':pin.text||'')+'</textarea></label>'+
    '<div class="field"><span style="display:block;font-size:13px;font-weight:600;color:var(--muted)">Photos</span><div class="photos" data-ph></div></div>'+
    (isNew?'':'<div class="muted small">Added by '+esc(who(pin.created_by))+' · '+esc(fmtWhen(pin.created_at))+(pin.status==='done'?'<br>Marked done by '+esc(who(pin.done_by))+' · '+esc(fmtWhen(pin.done_at)):'')+'</div>')+
    '<div class="mbtns">'+(!isNew&&!ro&&(pin.created_by===S.me.id||isAdminRole())?'<button class="btn danger" data-del>Delete</button>':'')+(!isNew&&!ro?'<button class="btn" data-done>'+(pin.status==='done'?'Reopen':'Mark done')+'</button>':'')+
    '<button class="btn" data-x>'+(ro?'Close':'Cancel')+'</button>'+(ro?'':'<button class="btn primary" data-save>Save</button>')+'</div>');
  const syncK=()=>$$('[data-k]',m).forEach(b=>b.classList.toggle('on',b.dataset.k===kind));syncK();
  $$('[data-k]',m).forEach(b=>b.onclick=()=>{kind=b.dataset.k;syncK()});
  const drawPh=()=>{
    const box=$('[data-ph]',m);
    box.innerHTML=photos.map(p=>'<img class="ph" alt="" data-path="'+esc(p)+'">').join('')+(!ro?'<label class="addph"><b>+</b>Photo<input type="file" accept="image/*,.heic,.heif" multiple hidden></label>':'')+(!photos.length&&ro?'<span class="muted small">No photos</span>':'');
    fillImgs(box);$$('.ph',box).forEach(i=>i.onclick=()=>showPhoto(i.dataset.path,$$('.ph',box).map(x=>x.dataset.path)));
    const inp=$('input[type=file]',box);
    if(inp)inp.onchange=()=>{const fs=[...inp.files];inp.value='';addPhotos(fs)};
  };
  const addPhotos=async fs=>{fs=fs.filter(isImgFile);if(!fs.length||ro)return;const lab=$('.addph',m);if(lab)lab.innerHTML='<b>…</b>Uploading';
    for(const f of fs){try{const b=await photoFromFile(f);const path=await putFile(jid+'/photos/'+uuid()+'.jpg',b);photos.push(path)}catch(e){toast(errMsg(e))}}drawPh()};
  if(!ro){m.addEventListener('dragover',e=>{e.preventDefault();m.classList.add('dropon')});m.addEventListener('dragleave',e=>{if(!m.contains(e.relatedTarget))m.classList.remove('dropon')});
    m.addEventListener('drop',e=>{e.preventDefault();m.classList.remove('dropon');addPhotos([...(e.dataTransfer&&e.dataTransfer.files||[])])})}
  drawPh();
  $('[data-x]',m).onclick=()=>m.close();
  const sb2=$('[data-save]',m);
  if(sb2)sb2.onclick=async()=>{const text=$('[data-text]',m).value.trim().slice(0,2000);sb2.disabled=true;
    const ok=isNew?await run(sb.from('pins').insert({job_id:jid,sheet_id:sheetId,layer:lay,x:at.x,y:at.y,kind,text,photos,status:'open'}))
      :await run(sb.from('pins').update({kind,text,photos}).eq('id',pin.id));
    if(ok){m.close();if(isNew&&V)setMode('pan');loadSheetData()}else sb2.disabled=false};
  const db=$('[data-done]',m);
  if(db)db.onclick=async()=>{const reopen=pin.status==='done';if(await run(sb.from('pins').update(reopen?{status:'open',done_by:null,done_at:null}:{status:'done',done_by:S.me.id,done_at:new Date().toISOString()}).eq('id',pin.id))){m.close();loadSheetData()}};
  const dl=$('[data-del]',m);
  if(dl)dl.onclick=async()=>{m.close();if(await confirmBox('Delete this pin for everyone?')&&await run(sb.from('pins').delete().eq('id',pin.id)))loadSheetData()};
}
</script>
