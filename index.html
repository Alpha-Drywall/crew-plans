<style>
:root{--bg:#f1f2f4;--card:#fff;--ink:#16191d;--muted:#5d6670;--line:#dde1e6;--head:#1d232b;--accent:#f2a516;--accent-ink:#1d232b;--danger:#c62828;--ok:#2e7d32;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.noscroll{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:4px;min-height:56px}
.top h1{grid-column:2;font-size:19px;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;text-align:center}
.top h1 .ttl{display:flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;letter-spacing:.6px}
.top h1 .brand{width:26px;height:26px;flex:none}
.top .jn{font-size:15px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.top .jn .sub{font-size:12px}
.top>button:last-child:not(:first-child){grid-column:3}
.jhead{position:sticky;top:0;z-index:20}
.jhead .top,.jhead .tabs{position:static}
.pbar{display:flex;gap:8px;align-items:center;margin:0 0 8px}
.pbar .btn{flex:none;white-space:nowrap}
.pbar select{flex:1;min-width:0;min-height:36px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;background:#fff;font-size:14px}
.pbar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-size:13px}
.pbar2 label{display:flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap}
.pbar2 input{width:18px;height:18px}
.pbar2 .grow{flex:1}
.olist{max-height:62vh;overflow:auto;margin:8px 0}
.osec{font-size:15px;margin:14px 0 6px}
.orow{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.orow>input{width:22px;height:22px;flex:none;margin-top:2px}
.orow .grow{flex:1;min-width:0}
.orow input:not([type]){width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-top:4px;font-size:14px}
.top .jl{display:none}
.dsk{display:none}
.tcper{display:flex;align-items:center;gap:10px;margin:0 0 12px;text-align:center}
.tcper .btn{min-width:44px}
.tchead{display:flex;gap:10px;flex-wrap:wrap}.tchead .field{flex:1;min-width:150px}
.tcsum{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin:4px 0 2px}
.tcw{padding:0;margin-bottom:10px}.tcwh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.tcwb{padding:0 12px 12px;border-top:1px solid var(--line)}
.tcwf{display:flex;gap:10px}.tcwf .field{flex:1}
.a2hs{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.25)}.a2card{background:#fff;color:#1f2328;border-radius:14px;padding:14px;max-width:520px;margin:0 auto;box-shadow:0 -4px 24px rgba(0,0,0,.25)}.a2ico{width:34px;height:34px;flex:none}.a2steps{margin:0 0 10px;padding-left:22px;line-height:1.45}.a2steps li{margin:4px 0}.a2k{display:inline-block;border:1px solid #bbb;border-radius:5px;padding:0 5px}
.tcbank{border:1px solid var(--line,#ddd);border-radius:10px;padding:10px;margin:0 0 12px;background:rgba(0,0,0,.02)}.tcbank .tcwf{margin-top:8px}
.tcday{border-top:1px solid var(--line);padding:8px 8px;margin:0 -8px}
.tcday.alt{background:#eef0f3}.tcday.alt .tcl{background:#fff}
.tcdh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tcl{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap;padding:6px;background:#f6f7f9;border-radius:10px}
.tcl select[data-job]{flex:1 1 100%}
.tcl select{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;font-size:14px}
.tcl select[data-code]{flex:1 1 auto}
@media (min-width:700px){.tcl{flex-wrap:nowrap}.tcl select[data-job]{flex:1 1 auto}.tcl select[data-code]{flex:0 0 190px}}
.tcl input{width:62px;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:15px;text-align:right}

function jsonRes(obj,status){return new Response(obj==null?null:JSON.stringify(obj),{status:status||200,headers:{'content-type':'application/json'}})}
function applyOps(table,rows,filters){
  const me=S.me&&S.me.id;
  for(const op of OFF.ops.concat(PR.ops)){
    if(me&&op.sub!==me)continue;
    if(op.table!==table&&!(op.kind==='rpc'&&table==='areas'))continue;
    const now=new Date(op.t).toISOString();
    if(op.kind==='insert'||op.kind==='upsert'){
      for(const r0 of op.rows){const r=Object.assign({created_at:now,created_by:op.sub},OFF_DEFAULTS[table]||{},r0);if(table==='logs'){r.user_id=r.user_id||op.sub;r.id=r.id||('local-'+op.n)}if(table==='timecards')r.owner=r.owner||op.sub;
        if(!rowHit(r,filters))continue;
        const i=op.kind==='upsert'&&op.conflict.length?rows.findIndex(x=>op.conflict.every(c=>String(x[c])===String(r[c]))):rows.findIndex(x=>x.id===r.id);
        if(i>=0)rows[i]=Object.assign({},rows[i],r0);else rows.push(r)}
    }else if(op.kind==='update'){rows.forEach((r,i)=>{if(rowHit(r,op.filters))rows[i]=Object.assign({},r,op.patch)})}
    else if(op.kind==='delete'){for(let i=rows.length-1;i>=0;i--)if(rowHit(rows[i],op.filters))rows.splice(i,1)}
    else if(op.kind==='rpc'&&op.rpc==='set_area_pct'&&table==='areas'){const a=op.args||{};rows.forEach((r,i)=>{if(r.id===a.a)rows[i]=Object.assign({},r,{pct:Object.assign({},r.pct||{},{[a.k]:a.v}),updated_by:op.sub,updated_at:now})})}
  }

}
function sortRows(rows,order){if(!order)return rows;const [col,dir]=order.split(',')[0].split('.');const d=dir==='desc'?-1:1;return rows.sort((a,b)=>{const x=a[col],y=b[col];return x==y?0:(x==null?-1:y==null?1:(x<y?-1:1))*d})}
function overlay(table,u,body,status,ct){
  if(!(myOps().length||PR.ops.length)||!(isPractice()?PR_TABLES:OFF_TABLES).includes(table))return new Response(body,{status,headers:{'content-type':ct||'application/json'}});
  let data;try{data=JSON.parse(body)}catch(e){return new Response(body,{status,headers:{'content-type':ct||'application/json'}})}
  if(!Array.isArray(data))return new Response(body,{status,headers:{'content-type':ct||'application/json'}});
  return jsonRes(sortRows(applyOps(table,data,urlFilters(u)),u.searchParams.get('order')),status);
}
async function offlineFetch(input,init){

  if(S.asUser&&roKind(u,method)==='block')return roDeny(u);
  const rest=u.pathname.startsWith('/rest/v1/'),stor=u.pathname.startsWith('/storage/v1/object/')&&!u.pathname.startsWith('/storage/v1/object/sign');
  if(!rest&&!stor)return fetch(input,init);
  const hdr=new Headers(init.headers||{});const name=rest?decodeURIComponent(u.pathname.slice(9)):'';const rpc=name.startsWith('rpc/')?name.slice(4):'';
  if(rest&&(method==='GET'||rpc==='office_names'||rpc==='claim_office')){
    await OFF.ready;
    const key=((S.me&&S.me.id)||jwtSub(hdr))+'|'+method+'|'+(hdr.get('accept')||'')+'|'+url+'|'+(method==='GET'?'':String(init.body||''));
    let res=null;
    if(navigator.onLine!==false){try{res=await netFetch(url,init,OFF.online?12000:4000)}catch(e){res=null}}
    if(res&&res.ok){const body=await res.text();const ct=res.headers.get('content-type');idbPut('resp',{body,ct,at:Date.now()},key);noteOnline(true);return overlay(name,u,body,res.status,ct)}
    if(res&&res.status!==0&&res.status<500)return res;
    noteOnline(false);
    const c=await idbGet('resp',key);
    if(c)return overlay(name,u,c.body,200,c.ct);
    throw new TypeError('Failed to fetch: not saved on this device yet');
  }
  const objPath=stor?decodeURIComponent(u.pathname.replace(/^\/storage\/v1\/object\/[^/]+\//,'')):'';
  const queueable=rest?(rpc?rpc==='set_area_pct':(isPractice()?PR_TABLES:OFF_TABLES).includes(name)):(method==='POST'&&/\/(photos|reports)\//.test(objPath));
  if(!queueable)return fetch(input,init);
  await OFF.ready;
  const sub=(S.me&&S.me.id)||jwtSub(hdr);const prefer=hdr.get('prefer')||'';
  const op={url,method,t:Date.now(),sub,table:rpc?'':name,headers:{}};
  hdr.forEach((v,k)=>{if(k!=='authorization')op.headers[k]=v});
  let body=init.body;
  if(stor){op.kind='file';op.path=objPath;
    if(body instanceof FormData){const form=[];body.forEach((v,k)=>form.push([k,v]));op.body={form};const blob=form.map(x=>x[1]).find(v=>v instanceof Blob);if(blob)await idbPut('img',blob,objPath)}
    else if(body instanceof Blob){op.body=body;await idbPut('img',body,objPath)}else op.body=body}
  else if(rpc){op.kind='rpc';op.rpc=rpc;try{op.args=JSON.parse(body)}catch(e){op.args={}}op.body=body}
  else if(method==='POST'){let rows;try{rows=JSON.parse(body)}catch(e){rows=[]}const arr=Array.isArray(rows)?rows:[rows];
    if(/merge-duplicates/.test(prefer)){op.kind='upsert';op.conflict=(u.searchParams.get('on_conflict')||'').split(',').filter(Boolean)}
    else{op.kind='insert';arr.forEach(r=>{if(r&&!r.id)r.id=uuid()})}
    op.rows=arr;body=JSON.stringify(Array.isArray(rows)?arr:arr[0]);op.body=body;init=Object.assign({},init,{body})}
  else if(method==='PATCH'){op.kind='update';op.filters=urlFilters(u);try{op.patch=JSON.parse(body)}catch(e){op.patch={}}op.body=body}
  else if(method==='DELETE'){op.kind='delete';op.filters=urlFilters(u);op.body=null;
    const lid=op.filters.find(([k,v])=>k==='id'&&v.startsWith('local-'));
    if(lid&&!isPractice()){const n=Number(lid[1].slice(6));const i=OFF.ops.findIndex(o=>o.n===n);if(i>=0){OFF.ops.splice(i,1);await idbDel('outbox',n);netPill()}return jsonRes(null,204)}}
  else return fetch(input,init);
  op.tries=0;
  if(isPractice()){if(stor)prFile(objPath);else prPush(op);}else{
  const n=await idbPut('outbox',op);
  if(n==null){if(navigator.onLine===false)throw new TypeError('Failed to fetch: could not save on this device');return netFetch(url,init,20000)}
  op.n=n;if(!OFF.ops.some(o=>o.n===n))OFF.ops.push(op);netPill();setTimeout(flushOutbox,0);}
  if(stor)return jsonRes({Id:uuid(),Key:u.pathname.split('/object/')[1]},200);
  const wantsObj=/vnd\.pgrst\.object/.test(hdr.get('accept')||'');const rep=/return=representation/.test(prefer);
  if(op.kind==='insert'||op.kind==='upsert'){const rows=op.rows.map(r=>Object.assign({created_at:new Date(op.t).toISOString(),created_by:sub},OFF_DEFAULTS[op.table]||{},r));if(wantsObj)return jsonRes(rows[0],201);if(rep)return jsonRes(rows,201)}
  return jsonRes(null,op.kind==='rpc'?204:(method==='POST'?201:204));
}
async function flushOutbox(){
  await OFF.ready;
  if(S.asUser||OFF.flushing||!myOps().length||!sb||!S.me||navigator.onLine===false)return;
  if(navigator.locks&&navigator.locks.request&&!OFF.inLock){return navigator.locks.request('acv-flush',{ifAvailable:true},async l=>{if(!l)return;OFF.inLock=true;try{OFF.ops=((await idbAll('outbox'))||[]).sort((x,y)=>x.n-y.n);await flushOutbox()}finally{OFF.inLock=false}}).catch(()=>{})}
  OFF.flushing=true;netPill();let sent=0,dropped=0,gaveUp=0;
  try{
    let tok=null;try{tok=(await sb.auth.getSession()).data.session?.access_token}catch(e){}
    while(true){
      const op=myOps()[0];if(!op)break;
      const h=new Headers(op.headers);if(tok)h.set('authorization','Bearer '+tok);
      let body=op.body;if(body&&body.form){const fd=new FormData();body.form.forEach(([k,v])=>fd.append(k,v));body=fd;h.delete('content-type')}
      let res;try{res=await netFetch(op.url,{method:op.method,headers:h,body},30000)}catch(e){noteOnline(false);break}
      noteOnline(true);
      if(res.status>=500||res.status===401||res.status===408||res.status===429){
        op.tries=(op.tries||0)+1;
        if(op.tries<8){await idbPut('outbox',op);if(res.status===401){try{await sb.auth.refreshSession()}catch(e){}}break}
        gaveUp++;
      }else if(!res.ok&&res.status!==409){let t='';try{t=await res.text()}catch(e){}if(!/Duplicate|already exists|23505/i.test(t))dropped++}
      if(!(await idbDel('outbox',op.n))){OFF.db=null;break}
      OFF.ops=OFF.ops.filter(o=>o.n!==op.n);sent++;netPill();
    }
  }finally{OFF.flushing=false;netPill()}
  if(dropped||gaveUp)toast((dropped+gaveUp)+' change'+(dropped+gaveUp>1?'s':'')+" couldn't be saved"+(gaveUp?' after several tries':'. You may not have permission anymore')+'.');
  else if(sent&&!myOps().length&&OFF.hadOffline){OFF.hadOffline=false;toast('All changes synced.')}
  if(sent){if(S.job)reloadJob();if(V)loadSheetData()}
}

  if(!p){if(!document.body)return;p=document.createElement('div');p.id='netpill';p.className='netpill';p.onclick=()=>{if(navigator.onLine!==false)flushOutbox();toast(myOps().length?myOps().length+' change'+(myOps().length>1?'s are':' is')+' saved on this device and will upload when you have signal.':(OFF.online?'Online.':'No signal. You can keep working on saved jobs; changes upload when you\'re back online.'))};document.body.appendChild(p)}
  const n=myOps().length;const off=!OFF.online||navigator.onLine===false;if(off)OFF.hadOffline=true;

  p.textContent=(off?'Offline':(OFF.flushing?'Syncing…':'Online'))+(n?' · '+n+' change'+(n>1?'s':'')+' waiting':'');
}

   Every Supabase call (database, storage, edge functions, auth) goes through offlineFetch, so roKind() there is the one gate.
   View as a person: reads run on the office login (office reads every row); every write is refused with a toast.
   Practice: writes to marks, pins, logs, areas, timecards and crew_roster go to PR (this browser only) and are laid over reads; everything else is refused. */

function roKind(u,method){const p=u.pathname;
  if(p.startsWith('/functions/'))return 'block';
  if(method==='GET'||method==='HEAD'||method==='OPTIONS')return 'read';
  if(p.startsWith('/rest/v1/rpc/')){const r=decodeURIComponent(p.slice(13));return RO_RPC.includes(r)?'read':isPractice()&&r==='set_area_pct'?'practice':'block'}
  if(p.startsWith('/rest/v1/'))return isPractice()&&method!=='PUT'&&PR_TABLES.includes(decodeURIComponent(p.slice(9)))?'practice':'block';
  if(p.startsWith('/storage/v1/object/sign/')||p.startsWith('/storage/v1/object/list/'))return 'read';
  if(p.startsWith('/storage/v1/object/'))return isPractice()&&method==='POST'&&/\/(photos|reports)\//.test(p)?'practice':'block';
  if(p==='/auth/v1/token')return 'read';
  return 'block';
}

    const wc=(S.jobs||[]).filter(j=>laborCost(L[j.id]));

function xlVal(c){let v=c&&c.value;if(v&&typeof v==='object'&&!(v instanceof Date)){if('result' in v||'formula' in v||'sharedFormula' in v)v=v.result;else if(v.richText)v=v.richText.map(t=>t.text).join('');else if('text' in v)v=v.text;else if(v.error)v=null}if(v&&typeof v==='object'&&v.error)v=null;return v==null?'':v}
function parseLaborSheet(wb){
  const sheets=wb.worksheets.slice().sort((a,b)=>(/^\s*labor\s*$/i.test(b.name)?1:0)-(/^\s*labor\s*$/i.test(a.name)?1:0));
  for(const ws of sheets){

    ws.eachRow({includeEmpty:false},(row,rn)=>{if(rn>60)return;row.eachCell({includeEmpty:false},(c,cn)=>{const t=String(xlVal(c)).trim().toUpperCase();

      if(!hpd&&/HRS PER DAY|HOURS PER DAY/.test(t)){for(let k=cn+1;k<cn+4;k++){const x=num(xlVal(row.getCell(k)));if(x>0){hpd=x;break}}}})});
    if(!hoursCol)continue;
    ws.eachRow({includeEmpty:false},(row,rn)=>{if(rn>60)return;let lab='';for(let k=1;k<hoursCol;k++){const x=String(xlVal(row.getCell(k))).trim();if(x){lab=x.toUpperCase();break}}

      const cell=row.getCell(hoursCol);const raw=cell.value;const v=num(xlVal(cell));
      if(raw&&typeof raw==='object'&&('formula' in raw||'sharedFormula' in raw)&&raw.result==null)missing++;

    if(found)return {sheet:ws.name,hours,jobNo,hpd,combined,missing};
  }
  return null;
}

function tipsFor(key){
  try{if(navigator.webdriver)return}catch(e){}
  if(!tipsOn()||tipBusy||lsGet('acv.tipSeen.'+key)||document.querySelector('.mwrap'))return;
  const vis=el=>{if(!el)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0};
  const steps=(TIPS[key]||[]).map(s=>({el:[...document.querySelectorAll(s[0])].find(vis),t:tipLang()==='es'?s[2]:s[1]})).filter(s=>s.el);
  if(!steps.length)return;
  lsSet('acv.tipSeen.'+key,'1');tipBusy=true;
  const es=tipLang()==='es';let i=0;
  const ov=document.createElement('div');ov.className='tipov';document.body.appendChild(ov);
  const hole=document.createElement('div');hole.className='tiphole';ov.appendChild(hole);
  const bub=document.createElement('div');bub.className='tipbub';ov.appendChild(bub);
  const done=()=>{ov.remove();tipBusy=false};
  const show=()=>{
    const s=steps[i];try{s.el.scrollIntoView({block:'center',behavior:'instant'})}catch(e){s.el.scrollIntoView()}
    setTimeout(()=>{
      const r=s.el.getBoundingClientRect();const p=6;
      Object.assign(hole.style,{left:(r.left-p)+'px',top:(r.top-p)+'px',width:(r.width+2*p)+'px',height:(r.height+2*p)+'px'});
      bub.innerHTML='<div>'+esc(s.t)+'</div><div class="tipbtns"><span class="muted small">'+(i+1)+' / '+steps.length+'</span><button class="btn sm" data-skip>'+(es?'Saltar':'Skip')+'</button><button class="btn sm primary" data-next>'+(i<steps.length-1?(es?'Siguiente':'Next'):(es?'Listo':'Got it'))+'</button></div>';
      const bw=Math.min(320,innerWidth-24);bub.style.width=bw+'px';
      bub.style.left=Math.max(12,Math.min(innerWidth-bw-12,r.left+r.width/2-bw/2))+'px';
      const below=r.bottom+p+12,bh=bub.offsetHeight||110;
      bub.style.top=(below+bh<innerHeight-8?below:Math.max(8,r.top-p-12-bh))+'px';
      $('[data-next]',bub).onclick=()=>{i++;if(i>=steps.length)done();else show()};
      $('[data-skip]',bub).onclick=done;
    },120);
  };
  show();
}

const LK={start:'',mode:'people',plans:{},loaded:false,loading:false,roster:[],cards:[],fms:[],sel:[],multi:false,sat:false,sx:0,q:null,M:null,addJobs:[]};

const lookDow=iso=>new Date(iso+'T12:00:00Z').getUTCDay();
/** Monday that starts the board: this week’s Monday; on Saturday or Sunday the coming Monday. */
function lookMonday(iso){const d=lookDow(iso);return isoAddD(iso,d===0?1:d===6?2:1-d)}

function lookDays(mon,sat){const out=[];for(let w=0;w<2;w++)for(let d=0;d<6;d++){const iso=isoAddD(mon,w*7+d);if(d<5||(sat&&sat(iso)))out.push(iso)}return out}

/** What each worker worked most recently on the time cards: {nameKey:{job,date,name}} = the app job with the most hours that day. Lines that match no job (office, vacation) are skipped. Only days before `before`. */
function lookLastWorked(cards,jobs,before){const keys=(jobs||[]).map(j=>[j.id,tcJobKey(j)]);const o={};
  (cards||[]).forEach(c=>{if(!c||!c.period_start)return;(c.workers||[]).forEach(w=>{const k=tcKey(w.name);if(!k)return;for(let d=0;d<12;d++){const iso=isoAddD(c.period_start,TC_OFF[d]);if(before&&iso>=before)continue;if(o[k]&&o[k].date>=iso)continue;

/** Same as time card: put each person on the job he last worked, on the empty Mon–Fri days in `dates` from minIso on. Days already planned are left alone. */
function lookPrefill(plans,people,dates,last,minIso){let P=plans||{};const by=lookByPerson(P);
  people.forEach(n=>{const k=tcKey(n),L=last[k];if(!L)return;const b=by[k];dates.forEach(d=>{const w=lookDow(d);if(d<minIso||w<1||w>5)return;if(b&&b.d[d]&&b.d[d].length)return;P=lookSet(P,L.job,[n],[d],true)})});

/** Time card jobs on one date: {nameKey:[jobIds]} (hours > 0; 'other' = lines that match no job in the app, like office or vacation). null when no card covers that date. */

    (c.workers||[]).forEach(w=>{const k=tcKey(w.name);((w.days&&w.days[d])||[]).forEach(l=>{if(!tcHrs(l))return;const m=keys.find(J=>tcIsJob(l,J[1][0],J[1][1]));const id=m?m[0]:'other';const a=o[k]=o[k]||[];if(!a.includes(id))a.push(id)})})});

/** Board warnings. dbl: a person on 2+ jobs the same day. idle: nothing planned on a Mon–Fri from today on. empty: an active job with nobody planned on any board day from today on.

/** Board rows: [{fm, names}] grouped by foreman. A worker goes under the foreman whose time card had him most recently; a foreman heads his own group.
    Crew list names never on a card (and planned names not on the list) go in the last group (fm ''). Cards owned by office logins (skip) are left out. */
function lookGroups(cards,roster,fms,skip,extra){const fmOf={},nm={},isFm=new Set();const add=n=>{const k=tcKey(n);if(k&&!nm[k])nm[k]=String(n).trim();return k};
  (fms||[]).forEach(f=>{const k=f&&add(f.name);if(k)isFm.add(k)});
  (cards||[]).filter(c=>c&&!(skip||[]).includes(c.owner)).sort((a,b)=>String(a.period_start).localeCompare(String(b.period_start))).forEach(c=>{const fk=add(c.foreman);if(!fk)return;isFm.add(fk);(c.workers||[]).forEach(w=>{const k=add(w.name);if(k&&k!==fk)fmOf[k]=fk})});

function lookDiff(a,b){const o={};a=a||{};b=b||{};new Set(Object.keys(a).concat(Object.keys(b))).forEach(j=>{const x=a[j]||{},y=b[j]||{};
    new Set(Object.keys(x).concat(Object.keys(y))).forEach(d=>{if(JSON.stringify(x[d]||[])!==JSON.stringify(y[d]||[]))(o[j]=o[j]||{})[d]=(y[d]&&y[d].length)?y[d]:null})});

/** Short job name for the board cells, made from the job name: first real word (skips U, of, the…), a 3-letter word gets the next word if it fits (IFA Elko), max 8 letters.

const LK_SKIP=new Set(['U','OF','THE','A','AN','AT','AND','&','-','–','FOR','NEW','PHASE','PH']);
function lookAuto(name){const w=tcJobShort(name).split(/[\s\/,]+/).map(x=>x.replace(/[^A-Za-z0-9&\-–]/g,'')).filter(Boolean);const ok=w.filter(x=>!LK_SKIP.has(x.toUpperCase()));const ws=ok.length?ok:w;if(!ws.length)return '?';
  const tc=x=>/\d/.test(x)||x.length<=3?x.toUpperCase():x.charAt(0).toUpperCase()+x.slice(1).toLowerCase();let t=tc(ws[0]);
  if(ws[0].length<=3&&ws[1]&&(t+' '+tc(ws[1])).length<=8)t+=' '+tc(ws[1]);return t.length>8?t.slice(0,8):t}
function lookNames(jobs){const o={},c={};(jobs||[]).forEach(j=>{const t=lookAuto(j.name);o[j.id]=t;c[t]=(c[t]||0)+1});
  (jobs||[]).forEach(j=>{if(c[o[j.id]]>1){const n=tcJobNo(j.name);if(n)o[j.id]=o[j.id].slice(0,8-n.length-1)+' '+n}});return o}
const lookShort=j=>{if(!j)return '?';const m=lookNames(S.jobs||[]);return m[j.id]||lookAuto(j.name)};
/** Number + full name for pickers and row labels: 330 U OF U OR5 HYBRID ROOM UPGRADE */
const lookFull=j=>j?((tcJobNo(j.name)?tcJobNo(j.name)+' ':'')+(tcJobShort(j.name)||j.name)):'?';
const lkJob=id=>(S.jobs||[]).find(j=>j.id===id);
function lookClean(la){const o={};if(!la||typeof la!=='object'||Array.isArray(la))return o;Object.keys(la).forEach(d=>{if(/^\d{4}-\d\d-\d\d$/.test(d)&&Array.isArray(la[d])){const a=la[d].filter(n=>typeof n==='string'&&n.trim());if(a.length)o[d]=a}});return o}
function openLook(){if(!lookCan())return;S.view='look';LK.start=LK.start||lookMonday(tcToday());LK.sel=[];LK.multi=false;window.scrollTo(0,0);loadLook()}

async function loadLook(){LK.loading=true;if(S.view==='look')render();

    const [bud,ro,cards,fms]=await Promise.all([q(sb.from('job_budget').select('job_id,lookahead:labor->lookahead')),q(sb.from('crew_roster').select('name').eq('active',true).order('name')).catch(()=>[]),

function renderLook(){let h='<div class="top"><button id="lkBack" aria-label="Back">‹</button><h1><div class="ttl"><span class="brand"></span>Alpha Operations</div></h1></div><main class="lkm'+(LK.multi?' multi':'')+'">';

function dispFont(f){let st=$('#dispFs');if(f===1){if(st)st.remove();return}
  const out=[];const walk=(rules,wrap)=>{[...rules].forEach(r=>{
    if(r.type===1){const fs=r.style&&r.style.fontSize;const m=/^([\d.]+)px$/.exec(fs||'');if(m){const s=r.selectorText+'{font-size:'+(Math.round(+m[1]*f*10)/10)+'px'+(r.style.getPropertyPriority('font-size')?'!important':'')+'}';out.push(wrap?wrap(s):s)}}

  [...document.styleSheets].forEach(sh=>{if(sh.ownerNode&&sh.ownerNode.id==='dispFs')return;let rs;try{rs=sh.cssRules}catch(e){return}if(rs)walk(rs,null)});

/* ===== Bids: tracker fields on each bid (amount, status, result, GCs invited, follow-up log) and the Pipeline page. Office only. ===== */
const BID_ST=[['open','Open'],['submitted','Submitted'],['won','Won'],['lost','Lost'],['nobid','No bid'],['rebid','Re-bid']];
const bidStLabel=s=>(BID_ST.find(x=>x[0]===s)||['',''])[1];
const isoD=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const dayDiff=(a,b)=>{const p=s=>{const [y,m,d]=String(s).split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const shortDay=s=>{const [y,m,d]=String(s||'').split('-').map(Number);return y&&m?MON3[m-1]+' '+d:''};
const moneyK=v=>{v=num(v);const a=Math.abs(v);return a>=1e6?'$'+(v/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,'')+'M':a>=1e4?'$'+Math.round(v/1e3)+'K':a>=1e3?'$'+(v/1e3).toFixed(1).replace(/\.0$/,'')+'K':'$'+Math.round(v)};
/* status shown for a bid: the saved status, or Open / Submitted from the bid date (an awarded job counts as Won) */
const bidStat=(j,td)=>j.bid_status&&BID_ST.some(s=>s[0]===j.bid_status)?j.bid_status:j.stage==='job'?'won':(j.bid_date&&j.bid_date<td?'submitted':'open');
/* Open = due today or later, or still waiting (open / submitted / re-bid). Results = won, lost, no bid. */
const bidFilt=(j,f,td)=>{const s=bidStat(j,td);return f==='res'?(s==='won'||s==='lost'||s==='nobid'):f==='all'?true:(!!(j.bid_date&&j.bid_date>=td)||s==='open'||s==='submitted'||s==='rebid')};
/* GCs invited: bid_gcs, or (older bids) the GC name typed on the bid, split at commas */
const bidGcs=j=>Array.isArray(j.bid_gcs)&&j.bid_gcs.length?j.bid_gcs:String(j.gc_name||'').split(/\s*[,;]\s*/).filter(Boolean).map((n,i,a)=>({name:n,email:a.length===1?String(j.gc_email||''):''}));
const bidMatch=(j,q)=>{q=String(q||'').trim().toLowerCase();if(!q)return true;return [j.name,j.gc_name,pmName(j.pm)].concat(bidGcs(j).map(g=>g.name)).some(x=>String(x||'').toLowerCase().includes(q))};
const pipeIn=j=>j.stage==='bid'||!!j.bid_status||j.bid_amount!=null;
const bidYear=j=>+String(j.bid_date||j.created_at||'').slice(0,4)||0;
const EST_COL=['#257de0','#f47230','#00b894','#f2a600','#ee7fac','#008a17','#6a4ce2','#ec4647'];
/* estimator colors follow the person (office names in A-Z order), never their rank */
function estColor(name){const ns=[...new Set((S.office||[]).map(o=>o.name))].sort((a,b)=>a.localeCompare(b));const i=ns.indexOf(name);return i>=0&&i<EST_COL.length?EST_COL[i]:'#9aa3ad'}
function bidDateBlock(d,td,res,cls){if(!d)return '<div class="bdate none'+(cls||'')+'"><span>No</span><b>date</b></div>';const n=dayDiff(td,d),[y,m,dd]=d.split('-').map(Number);
  return '<div class="bdate'+(res?'':n>=0&&n<=7?' soon':n<0?' past':'')+(cls||'')+'" title="'+esc(fmtDay(d))+'"><span>'+MON3[m-1]+(y!==+td.slice(0,4)?' ’'+String(y).slice(2):'')+'</span><b>'+dd+'</b></div>'}
const bidPill=s=>'<span class="bpill s-'+s+'">'+bidStLabel(s)+'</span>';
function bidCard(j,td){const s=bidStat(j,td),g=bidGcs(j),notes=Array.isArray(j.bid_notes)?j.bid_notes:[],last=notes[notes.length-1],d=j.bid_date,n=d?dayDiff(td,d):null,res=s==='won'||s==='lost'||s==='nobid';
  let l2=d?(n===0?'<b class="due">Due today</b>':n>0&&n<=14?'<b class="due">Due in '+n+' day'+(n===1?'':'s')+'</b>':'Bid '+shortDay(d)+(d.slice(0,4)!==td.slice(0,4)?', '+d.slice(0,4):'')):'No bid date';
  if(g.length)l2+=' · '+esc(g[0].name)+(g.length>1?' +'+(g.length-1):'');
  let l3='';if(res&&j.bid_result)l3=esc(j.bid_result);else if(last)l3=esc(last.text)+(last.at?' · '+shortDay(last.at):'');else if(!res&&d&&n<-7)l3='<span class="bwarn">No follow-up yet · bid '+(-n)+' days ago</span>';
  return '<div class="card bidc" data-bid="'+esc(j.id)+'" tabindex="0" role="button" aria-label="'+esc(j.name||'Bid')+' details">'+bidDateBlock(d,td,res)+'<div class="grow"><div class="name">'+esc(j.name||'Untitled bid')+'</div><div class="muted small">'+l2+'</div>'+(l3?'<div class="small bl3">'+l3+'</div>':'')+'</div>'+
    '<div class="bidr"><div class="amt">'+(j.bid_amount!=null&&j.bid_amount!==''?money(j.bid_amount):'<span class="muted">No $ yet</span>')+'</div>'+bidPill(s)+'</div><button class="bgo" data-go="'+esc(j.id)+'" title="Open plans & takeoff" aria-label="Open plans and takeoff for '+esc(j.name||'bid')+'">›</button></div>'}
function renderBidsSec(){const pane=lsGet('crewplans.bidPane')==='pipe'?'pipe':'list';

function renderBidList(){const bv=lsGet('crewplans.bidView')==='all'?'all':'mine',f=lsGet('crewplans.bidFilt')||'open';

function bidListHtml(){const td=today(),bv=lsGet('crewplans.bidView')==='all'?'all':'mine',f=lsGet('crewplans.bidFilt')||'open';
  if(!(S.bids||[]).length)return '<div class="empty"><b>No bids yet</b>Add a bid, upload its plans, then do the takeoff on its Takeoff tab. To bring in this year’s Excel tracker, use ☰ → Import bid tracker.</div>';
  let list=(S.bids||[]).filter(j=>bidFilt(j,f,td)&&bidMatch(j,S.bidQ));if(bv==='mine')list=list.filter(j=>j.pm&&j.pm===S.myOfficeId);
  if(!list.length)return '<div class="empty"><b>'+(S.bidQ?'Nothing matches “'+esc(S.bidQ)+'”':bv==='mine'?'No '+(f==='res'?'results':f==='open'?'open bids':'bids')+' with you as estimator':'No '+(f==='res'?'results yet':'open bids'))+'</b>'+(bv==='mine'?'Tap All bids to see everyone’s.':'Try All.')+'</div>';
  const ph=j=>{const s=bidStat(j,td);return s==='won'||s==='lost'||s==='nobid'?3:!j.bid_date?2:j.bid_date>=td?0:1};
  list.sort((a,b)=>{const pa=ph(a),pb=ph(b);if(pa!==pb)return pa-pb;if(pa===0)return String(a.bid_date).localeCompare(String(b.bid_date));return String(b.result_date||b.bid_date||b.created_at||'').localeCompare(String(a.result_date||a.bid_date||a.created_at||''))});
  const tot=list.reduce((a,j)=>a+num(j.bid_amount),0);
  let h='<div class="bsum">'+list.length+' bid'+(list.length===1?'':'s')+(tot?' · '+moneyK(tot)+' bid':'')+'</div>';
  const grp=(k,arr,unit)=>'<div class="logday"><span>'+esc(k)+'</span><span class="muted">'+arr.length+' '+unit+(arr.length===1?'':'s')+(arr.some(j=>num(j.bid_amount))?' · '+moneyK(arr.reduce((a,j)=>a+num(j.bid_amount),0)):'')+'</span></div>'+arr.map(j=>bidCard(j,td)).join('');
  if(bv==='all'){const g={};list.forEach(j=>{const k=pmName(j.pm)||'No estimator';(g[k]=g[k]||[]).push(j)});Object.keys(g).sort((a,b)=>a==='No estimator'?1:b==='No estimator'?-1:a.localeCompare(b)).forEach(k=>h+=grp(k,g[k],'bid'));return h}
  const L=['Coming up','Waiting on results','No bid date','Results'],g=[[],[],[],[]];list.forEach(j=>g[ph(j)].push(j));g.forEach((arr,i)=>{if(arr.length)h+=grp(L[i],arr,'bid')});return h}

  const rev=j.revision_of&&(S.bids||[]).concat(S.jobs||[]).find(x=>x.id===j.revision_of);const emails=g.map(x=>x.email).filter(Boolean);

  h+='<div class="bpacts">'+(j.stage==='bid'?'<button class="btn primary sm" data-open>Open plans & takeoff</button><button class="btn sm" data-edit>Edit bid</button><button class="btn sm" data-award>Mark awarded</button>':'<button class="btn primary sm" data-open>Open job</button>')+'</div>';

function pipeMonthSvg(T,W){const H=W<520?200:240,L=W<520?40:52,R=6,Tp=18,B=24,pw=W-L-R,ph=H-Tp-B;const mx=Math.max(0,...T.months.map(m=>m.total));const N=niceMax(mx);const y=v=>Tp+ph-(v/N.max)*ph;const band=pw/12,bw=Math.max(8,Math.min(40,band*.62));

async function trkSave(P){const sel=P.items.filter(x=>x.on&&x.action!=='skip'),src='tracker-'+P.yr;const news=sel.filter(x=>x.action==='new'||x.act==='new').map(x=>trkRow(x.r,x.pm,src)),ups=sel.filter(x=>x.action==='merge'&&x.act!=='new');
  const pb=progressBox('Saving bids…');let added=0,upd=0,bad=0;
  for(let i=0;i<news.length;i+=50){pb.set('Adding bids '+(i+1)+'–'+Math.min(i+50,news.length)+' of '+news.length+'…');try{await q(sb.from('jobs').insert(news.slice(i,i+50)));added+=Math.min(50,news.length-i)}catch(e){bad++;toast(errMsg(e))}}
  for(const x of ups){pb.set('Updating '+x.match.name+'…');try{await q(sb.from('jobs').update(x.patch).eq('id',x.match.id));upd++}catch(e){bad++}}
  pb.close();await loadJobs();lsSet('crewplans.homeSec','bids');lsSet('crewplans.bidView','all');if(S.view!=='job'){S.view='jobs';render()}
  toast('Imported '+added+' bid'+(added===1?'':'s')+(upd?', updated '+upd:'')+'.'+(bad?' Some rows didn’t save; run the import again to retry them.':''))}

/* download a whole job as one ZIP (for filing in OneDrive) */
const csvCell=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCsv=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
const fileSafe=t=>String(t||'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,80)||'file';
const fmtDate=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString()};
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>rej(new Error('image'));i.src=url})}
function drawSheet(img,marks,pins){
  const W=img.naturalWidth,H=img.naturalHeight,M=Math.max(W,H);const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(img,0,0);g.globalCompositeOperation='multiply';
  for(const m of marks){const col=phase(m.phase).c;const sw=clamp(num(m.w,.006),.001,.03)*M;const {kind,p}=markGeom(m);
    if(kind==='box'&&p.length>=4){g.globalAlpha=.28;g.fillStyle=col;g.fillRect(p[0]*W,p[1]*H,(p[2]-p[0])*W,(p[3]-p[1])*H);g.globalAlpha=.85;g.strokeStyle=col;g.lineWidth=sw/2;g.strokeRect(p[0]*W,p[1]*H,(p[2]-p[0])*W,(p[3]-p[1])*H)}
    else if(p.length>=4){g.globalAlpha=.6;g.strokeStyle=col;g.lineWidth=sw;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(p[0]*W,p[1]*H);for(let i=2;i+1<p.length;i+=2)g.lineTo(p[i]*W,p[i+1]*H);g.stroke()}}
  g.globalCompositeOperation='source-over';g.globalAlpha=1;const r=M*.009;
  pins.forEach((pn,i)=>{const x=clamp(num(pn.x),0,1)*W,y=clamp(num(pn.y),0,1)*H;const col=pn.status==='done'?'#2e7d32':({issue:'#d32f2f',question:'#f59e0b',extra:'#0f766e',note:'#475569'})[pinKind(pn.kind).k];
    g.beginPath();g.arc(x,y-r*1.4,r,0,Math.PI*2);g.fillStyle=col;g.fill();g.lineWidth=r*.18;g.strokeStyle='#fff';g.stroke();
    g.fillStyle='#fff';g.font='bold '+Math.round(r*1.1)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(String(i+1),x,y-r*1.4)});
  return c;
}
async function downloadJob(){
  const job=S.job;const pb=progressBox('Getting ready…');
  try{
    pb.set('Loading tools…');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    pb.set('Collecting job data…');
    const [sheets,marks,pins,areas,logs,members]=await Promise.all([
      q(sb.from('sheets').select('*').eq('job_id',job.id).eq('is_current',true).order('sort')),
      q(sb.from('marks').select('*').eq('job_id',job.id).eq('layer','plans').order('created_at')),
      q(sb.from('pins').select('*').eq('job_id',job.id).eq('layer','plans').order('created_at')),
      q(sb.from('areas').select('*').eq('job_id',job.id).order('created_at')),
      q(sb.from('logs').select('*').eq('job_id',job.id).order('date')),
      q(sb.from('members').select('*').eq('job_id',job.id))]);
    members.forEach(m=>S.people[m.user_id]=m.name);
    const base=fileSafe(job.name);const zip=new window.JSZip();const top=zip.folder(base+' - Alpha Operations '+today());
    const {jsPDF}=window.jspdf;let pdf=null;const pinRows=[['Sheet','Pin #','Type','Status','Note','Added by','Added','Done by','Done','Photos']];
    const photosDir=top.folder('Photos');
    for(let i=0;i<sheets.length;i++){
      const sh=sheets[i];pb.set('Drawing sheet '+(i+1)+' of '+sheets.length+'…');
      const sm=marks.filter(m=>m.sheet_id===sh.id),sp=pins.filter(p=>p.sheet_id===sh.id);
      let canvas=null;try{const [u]=await urlsFor([sh.path]);const img=await loadImg(u);canvas=drawSheet(img,sm,sp)}catch(e){}
      if(canvas){const W=canvas.width,H=canvas.height;const pw=W/5,ph=H/5;const data=canvas.toDataURL('image/jpeg',.85);
        if(!pdf)pdf=new jsPDF({orientation:pw>ph?'landscape':'portrait',unit:'pt',format:[pw,ph]});else pdf.addPage([pw,ph],pw>ph?'landscape':'portrait');
        pdf.addImage(data,'JPEG',0,0,pw,ph,undefined,'FAST');pdf.setFontSize(9);pdf.setTextColor(90);pdf.text(job.name+' · '+sh.name,8,ph-6);canvas.width=canvas.height=0}
      for(let k=0;k<sp.length;k++){const pn=sp[k];const names=[];const ph=Array.isArray(pn.photos)?pn.photos:[];
        for(let j=0;j<ph.length;j++){try{const [u]=await urlsFor([ph[j]]);const b=await (await fetch(u)).blob();const nm=fileSafe(sh.name+' pin '+(k+1)+(ph.length>1?' ('+(j+1)+')':''))+'.jpg';photosDir.file(nm,b);names.push(nm)}catch(e){}}
        pinRows.push([sh.name,k+1,pinKind(pn.kind).n,pn.status==='done'?'Done':'Open',pn.text,who(pn.created_by),fmtDate(pn.created_at),pn.done_by?who(pn.done_by):'',pn.done_at?fmtDate(pn.done_at):'',names.join('; ')])}
    }
    pb.set('Writing the files…');
    if(pdf)top.file(base+' - Marked-up plans.pdf',pdf.output('blob'));
    top.file(base+' - Pins.csv',toCsv(pinRows));
    const sc=PHASES;top.file(base+' - Progress.csv',toCsv([['Area'].concat(sc.map(p=>p.n+' %')).concat(['Last updated','Updated by'])].concat(areas.map(a=>[a.name].concat(sc.map(p=>areaPct(a,p.k))).concat([a.updated_at?fmtDate(a.updated_at):'',a.updated_by?who(a.updated_by):''])))));
    top.file(base+' - Daily logs.csv',toCsv([['Date','Foreman','Crew on site','Man-hours','Work done','Material delivered','Delays / notes']].concat(logs.map(l=>[l.date,who(l.user_id),num(l.crew),num(l.hours),l.work,(l.materials||[]).length?l.materials.map(matRowText).join('; '):l.deliveries,l.notes]))));
    top.file('README.txt','Alpha Operations export for '+job.name+(job.addr?' ('+job.addr+')':'')+'\r\nExported '+new Date().toLocaleString()+'\r\n\r\nMarked-up plans.pdf - every sheet with crew markups; numbered pins match Pins.csv.\r\nScope colors: '+sc.map(p=>p.n).join(', ')+'\r\nPhotos - pin photos, named by sheet and pin number.\r\n');
    const blob=await zip.generateAsync({type:'blob'},m=>pb.set('Zipping… '+Math.round(m.percent)+'%'));
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=base+' - Alpha Operations '+today()+'.zip';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000);
    pb.close();toast('Downloaded. Save it to the job\'s OneDrive folder.');
  }catch(e){pb.close();toast("Couldn't build the download: "+errMsg(e))}
}

const DOC_RE=/^(RFI|ASI|PR|CCD|PCO|ADD(?:ENDUM)?|BULLETIN|SK)\s*#?\s*(\d{1,4})(?:\s*R(?:EV)?\s*(\d{1,2}))?(?=[-\s–_.]|$)/i;

async function readForOrganize(s,opt){
  const img=await sheetImage(s);const W=img.naturalWidth||img.width;const out={num:null,title:null,cands:[],revLines:[],docLines:[]};
  if(opt.name){try{const o=await nameFromImage(img);Object.assign(out,{num:o.num,title:o.title,cands:o.cands})}catch(e){}}
  if(opt.rev){const sc=Math.min(1.4,2400/Math.max(1,W*.2));out.revLines=(await ocrLines(cropFrom(img,.8,0,1,1,0,sc),3)).concat(await ocrLines(cropFrom(img,.5,.8,1,1,0,Math.min(1.2,2400/Math.max(1,W*.5))),3))}

function poRows(items){

      const po=matPO(r.po);if(po){const c2=c.filter(x=>matPOEq(matPO(x.l.po),po));if(c2.length)c=c2}
      if(c.length){const best=Math.max(...c.map(x=>x.s));c=c.filter(x=>best-x.s<1e-6).sort((a,b)=>(num(b.l.qty)-b.l.got)-(num(a.l.qty)-a.l.got));ln=c[0].l}}

    if(l.st==='over')flags.push({lvl:'over',id:l.id,t:l.item+': '+matQ(g)+' delivered, '+matQ(q)+' ordered'});

  const drawPh=()=>{
    const box=$('[data-ph]',m);
    box.innerHTML=photos.map(p=>'<img class="ph" alt="" data-path="'+esc(p)+'">').join('')+(!ro?'<label class="addph"><b>+</b>Photo<input type="file" accept="image/*,.heic,.heif" multiple hidden></label>':'')+(!photos.length&&ro?'<span class="muted small">No photos</span>':'');
    fillImgs(box);$$('.ph',box).forEach(i=>i.onclick=()=>showPhoto(i.dataset.path));
    const inp=$('input[type=file]',box);
    if(inp)inp.onchange=()=>{const fs=[...inp.files];inp.value='';addPhotos(fs)};
  };
  const addPhotos=async fs=>{fs=fs.filter(isImgFile);if(!fs.length||ro)return;const lab=$('.addph',m);if(lab)lab.innerHTML='<b>…</b>Uploading';
    for(const f of fs){try{const b=await photoFromFile(f);const path=await putFile(jid+'/photos/'+uuid()+'.jpg',b);photos.push(path)}catch(e){toast(errMsg(e))}}drawPh()};
  if(!ro){m.addEventListener('dragover',e=>{e.preventDefault();m.classList.add('dropon')});m.addEventListener('dragleave',e=>{if(!m.contains(e.relatedTarget))m.classList.remove('dropon')});
    m.addEventListener('drop',e=>{e.preventDefault();m.classList.remove('dropon');addPhotos([...(e.dataTransfer&&e.dataTransfer.files||[])])})}
  drawPh();
  $('[data-x]',m).onclick=()=>m.close();
  const sb2=$('[data-save]',m);
  if(sb2)sb2.onclick=async()=>{const text=$('[data-text]',m).value.trim().slice(0,2000);sb2.disabled=true;
    const ok=isNew?await run(sb.from('pins').insert({job_id:jid,sheet_id:sheetId,layer:lay,x:at.x,y:at.y,kind,text,photos,status:'open'}))
      :await run(sb.from('pins').update({kind,text,photos}).eq('id',pin.id));
    if(ok){m.close();if(isNew&&V)setMode('pan');loadSheetData()}else sb2.disabled=false};
  const db=$('[data-done]',m);
  if(db)db.onclick=async()=>{const reopen=pin.status==='done';if(await run(sb.from('pins').update(reopen?{status:'open',done_by:null,done_at:null}:{status:'done',done_by:S.me.id,done_at:new Date().toISOString()}).eq('id',pin.id))){m.close();loadSheetData()}};
  const dl=$('[data-del]',m);
  if(dl)dl.onclick=async()=>{m.close();if(await confirmBox('Delete this pin for everyone?')&&await run(sb.from('pins').delete().eq('id',pin.id)))loadSheetData()};
}
</script>
</body>
</html>
