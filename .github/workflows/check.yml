name: App loads check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the app's JavaScript for errors
        run: node .github/scripts/check.js
      - name: Test the time card hours math, labor alerts and office people off the crew list
        run: node .github/scripts/timecards-test.js
      - name: Test view-as (read-only) and practice mode
        run: node .github/scripts/viewas-test.js
      - name: Test the all-jobs-at-a-glance math
        run: node .github/scripts/dashboard-test.js
      - name: Test materials vs. the order (paste, PO PDF rows and columns, matching, status, flags)
        run: node .github/scripts/materials-test.js
      - name: Test T&M tickets (numbering, time card 172, status, CSV)
        run: node .github/scripts/tm-test.js
      - name: Test the crew lookahead board
        run: node .github/scripts/lookahead-test.js
      - name: Test the Billing tab % from hours (trade codes, %, Mob/Submittals, Done %, time cards past the job cost sheet)
        run: node .github/scripts/progress-test.js
      - name: Test Load pay app (.xlsx) on the Billing tab (continuation sheet lines, G702, history)
        run: node .github/scripts/payapp-test.js
      - name: Test the takeoff math (feet parsing, LF/SF, scale, totals, bid sheet rows, saving edits)
        run: node .github/scripts/takeoff-test.js
      - name: Test the bid tracker (Excel tracker import, status cleanup, GC column split, Pipeline numbers, export)
        run: node .github/scripts/tracker-test.js
      - name: Test the bid list (Coming up by bid date, Due today / This week / Later, estimator groups, collapsed sections)
        run: node .github/scripts/bids-test.js
      - name: Test bid In for review, lookahead job remove / undo, phone job-tab rows (Field / Office)
        run: node .github/scripts/office-review-test.js
